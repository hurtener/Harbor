name: prompt-policy-workbench

on:
  push:
    branches: [fix/live-progress-and-guidance-boundaries]
    paths: [.github/workflows/prompt-policy-workbench.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Apply hash-verified reviewed patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '654da2963208d1b3ba3f364baa67561cd92ae5448840a11468656953a01f06eb'
          pathlib.Path('/tmp/prompt-policy.patch').write_bytes(patch)
          PY
          git apply --check /tmp/prompt-policy.patch
          git apply /tmp/prompt-policy.patch
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
      - name: Format, diff, smoke, and mirror checks
        run: |
          test -z "$(gofmt -l internal/planner/react/prompt.go internal/planner/react/prompt_test.go internal/planner/react/react_test.go)"
          git diff --check
          bash scripts/smoke/phase-83a.sh
          make check-mirror
      - name: Vet changed package
        run: go vet ./internal/planner/react/...
      - name: Race-enabled planner and public facade suites
        run: go test -race -count=1 ./internal/planner/... ./sdk/planner/...
      - name: Publish verified product changes on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CHANGELOG.md docs/CONFIG.md docs/plans/phase-83a-react-prompt-structured-sections.md docs/research/13-react-prompt-engineering.md docs/skills/define-the-agent-yaml/SKILL.md internal/planner/react/prompt.go internal/planner/react/prompt_test.go internal/planner/react/react_test.go internal/planner/react/testdata/golden_default_prompt.txt scripts/smoke/phase-83a.sh
          git commit -m 'fix(react): clarify progress and developer guidance boundaries'
          git push origin HEAD:refs/heads/fix/live-progress-and-guidance-boundaries
