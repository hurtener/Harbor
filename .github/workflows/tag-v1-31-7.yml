name: Tag Harbor v1.31.7
on:
  push:
    branches: [chore/tag-v1.31.7]
    paths: [.github/workflows/tag-v1-31-7.yml]
permissions:
  contents: read
jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: c8d8812f5f18597210a78b7ed44961b56463665a
      TAG: v1.31.7
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify the published annotated tag without moving it
        run: |
          set -euo pipefail
          mkdir -p /tmp/tag-evidence
          git fetch origin main --tags
          git merge-base --is-ancestor "$TARGET" origin/main
          test "$(git rev-parse "$TAG")" = 12785fb25486227a062f13acb9e2a4c8c8936202
          test "$(git rev-parse "$TAG^{commit}")" = "$TARGET"
          test "$(git cat-file -t "$TAG")" = tag
          git cat-file -p "$TAG" | tee /tmp/tag-evidence/tag.txt
          git rev-parse "$TAG" > /tmp/tag-evidence/tag-object.txt
          git rev-parse "$TAG^{commit}" > /tmp/tag-evidence/commit.txt
          git log --oneline "v1.31.6..$TARGET" > /tmp/tag-evidence/commits.txt
          git show "$TARGET:CHANGELOG.md" > /tmp/tag-evidence/changelog.txt
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true
      - name: Independently resolve the public Go module and provenance
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          cd /tmp/tag-evidence
          go mod download -json "github.com/hurtener/Harbor@$TAG" > module.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('module.json').read_text())
          assert not p.get('Error'), p
          assert p['Version'] == os.environ['TAG'], p
          assert p['Origin']['Hash'] == os.environ['TARGET'], p
          assert p['Origin']['Ref'] == 'refs/tags/' + os.environ['TAG'], p
          print(json.dumps(p, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-v1.31.7-tag-evidence
          path: /tmp/tag-evidence
          retention-days: 5
