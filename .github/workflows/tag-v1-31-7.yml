name: Tag Harbor v1.31.7
on:
  push:
    branches: [chore/tag-v1.31.7]
    paths: [.github/workflows/tag-v1-31-7.yml]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: c8d8812f5f18597210a78b7ed44961b56463665a
      TAG: v1.31.7
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify main ancestry and create an immutable annotated tag
        run: |
          set -euo pipefail
          mkdir -p /tmp/tag-evidence
          git fetch origin main --tags
          git merge-base --is-ancestor "$TARGET" origin/main
          test "$(git rev-parse v1.31.6^{commit})" = 9c51e05dd2431a826897cfad5d8a1827cdb5d596
          git merge-base --is-ancestor v1.31.6 "$TARGET"
          test "$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)" = v1.31.6
          test -z "$(git tag --list "$TAG")"
          git config user.name 'Santiago Benvenuto'
          git config user.email '117486687+hurtener@users.noreply.github.com'
          git tag -a "$TAG" "$TARGET" -m 'Harbor v1.31.7: live progress, developer guidance boundaries, durable SSE replay, and preflight repairs (PR #776)'
          git push origin "refs/tags/$TAG"
          git cat-file -p "$TAG" | tee /tmp/tag-evidence/tag.txt
          git rev-parse "$TAG" | tee /tmp/tag-evidence/tag-object.txt
          git rev-parse "$TAG^{commit}" | tee /tmp/tag-evidence/commit.txt
          git log --oneline "v1.31.6..$TARGET" > /tmp/tag-evidence/commits.txt
          git show "$TARGET:CHANGELOG.md" | head -150 > /tmp/tag-evidence/changelog.txt
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
      - name: Independently resolve the public Go module and provenance
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          cd /tmp/tag-evidence
          go mod download -json "github.com/hurtener/Harbor@$TAG" > module.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('module.json').read_text())
          assert not p.get('Error'), p
          assert p['Version'] == os.environ['TAG'], p
          assert p['Origin']['Hash'] == os.environ['TARGET'], p
          assert p['Origin']['Ref'] == 'refs/tags/' + os.environ['TAG'], p
          print(json.dumps(p, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-v1.31.7-tag-evidence
          path: /tmp/tag-evidence
          retention-days: 5
