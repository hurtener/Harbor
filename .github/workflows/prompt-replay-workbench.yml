name: prompt-replay-workbench

on:
  push:
    branches: [fix/live-progress-and-guidance-boundaries]
    paths: [.github/workflows/prompt-replay-workbench.yml]

permissions:
  contents: read
  actions: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Collect failed preflight log and exact branch identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/replay-evidence
          gh api repos/hurtener/Harbor/actions/jobs/103375001217/logs > /tmp/replay-evidence/macos-preflight.log
          git rev-parse HEAD > /tmp/replay-evidence/source-sha.txt
          git archive --format=tar.gz --output=/tmp/replay-evidence/branch-source.tar.gz HEAD
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/replay-evidence/macos-preflight.log').read_text().splitlines()
          selected = set()
          for i, line in enumerate(lines):
              if any(s in line for s in ['[FAIL]', 'FAIL:', 'preflight: FAIL', 'preflight: FAILED', 'asserted nothing']):
                  selected.update(range(max(0, i - 3), min(len(lines), i + 5)))
          selected.update(range(max(0, len(lines) - 65), len(lines)))
          summary = '\n'.join(f'{i + 1}: {lines[i]}' for i in sorted(selected))
          Path('/tmp/replay-evidence/failures.txt').write_text(summary)
          print(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-preflight-diagnostics
          path: /tmp/replay-evidence
          retention-days: 1
