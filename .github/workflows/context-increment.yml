name: context development increment

# Temporary same-repository PR transport while local Git DNS is unavailable.
# Only a plain patch with its tested tree and checksum is accepted. Remove
# before RC. No workflow edits, credentials, force pushes or releases are allowed.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/context-increment.json
      - .github/context-recovery.json
permissions:
  contents: read
jobs:
  publish:
    if: github.event.pull_request.number == 779 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/portable-session-context-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Publish exact tested tree
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          manifest = pathlib.Path('.github/context-increment.json')
          change = json.loads(manifest.read_text())
          # Recovery reuses the existing patch bytes, but supplies newly tested
          # base/checksum/tree metadata. The same strict validations follow.
          recovery = pathlib.Path('.github/context-recovery.json')
          if recovery.exists():
              verified = json.loads(recovery.read_text())
              if set(verified) != {'base', 'sha256', 'tree', 'message'}:
                  raise SystemExit('Invalid recovery metadata')
              verified['patch'] = change['patch']
              change = verified
          if git('rev-parse', 'HEAD^') != change['base']:
              raise SystemExit('Base changed; refusing stale increment')
          patch = change['patch'].encode('utf-8')
          if len(patch) > 2 * 1024 * 1024 or hashlib.sha256(patch).hexdigest() != change['sha256']:
              raise SystemExit('Patch does not match validated checksum')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'context-increment.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', '--whitespace=error-all', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error-all', str(path)], check=True)
          allowed = ('internal/', 'sdk/', 'test/', 'harbortest/', 'scripts/', 'docs/', 'examples/')
          roots = {'README.md', 'RFC-001-Harbor.md', 'RFC-002-Session-Context.md', 'CHANGELOG.md'}
          for name in git('diff', '--cached', '--name-only').splitlines():
              if name not in roots and not name.startswith(allowed):
                  raise SystemExit('Patch changes an unauthorized path')
          subprocess.run(['git', 'rm', '--', str(manifest)], check=True)
          if recovery.exists():
              subprocess.run(['git', 'rm', '--', str(recovery)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          if git('write-tree') != change['tree']:
              raise SystemExit('Result differs from the locally validated tree')
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git', 'commit', '-m', change['message']], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/docs/portable-session-context-plan'], check=True)
          print('Published verified increment:', git('rev-parse', 'HEAD'))
