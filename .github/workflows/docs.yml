name: docs

# Build the published docs site on every PR (validation only) and on
# every push to main; deploy to GitHub Pages on main. The build is
# load-bearing on PRs even when no deploy happens — a dead site-internal
# link (a renamed skill, a deleted recipe, a moved reference page) fails
# the build before merge, the same drift-hygiene posture CLAUDE.md §18
# applies to the operator skills themselves.
#
# Ported from the sibling Dockyard project's docs workflow (Phase 103 —
# Dockyard parity) so the two project sites age together. Since Phase
# 113a (D-209) the build job also runs `make protocol-docs-gen-check`
# — the generated Protocol contract reference under docs/site/protocol
# must match the canonical Go sources — so the job carries the Go
# toolchain in addition to node.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pages deploy permissions follow the official actions/deploy-pages
# template: the deploy job (only) needs `pages: write` + `id-token: write`.
# The build job runs as read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Validation may supersede only an older run for the SAME ref. Different PRs
# never contend for one slot; the deploy job below separately serializes the
# singleton Pages environment across main pushes.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  # A newer validation may supersede an older validation for the same PR.
  # Main deployments queue instead: cancelling the workflow here would also
  # cancel an already-running deploy before the job-level Pages lock can act.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build VitePress site
    runs-on: ubuntu-latest
    env:
      # Pin the published-site base URL to the GitHub Pages path. Override
      # by editing this value if the repo is renamed; the config reads
      # DOCS_BASE from the environment.
      DOCS_BASE: /Harbor/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      # Phase 113a (D-209): the generated Protocol contract reference
      # must be in sync with the canonical Go sources BEFORE the site
      # builds — a method / error / event / wire-type change without a
      # regenerated docs/site/protocol fails the same job that would
      # publish it. The generator compiles against the Protocol
      # packages, so this job now needs the Go toolchain.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
      - run: make protocol-docs-gen-check
      # The Console Protocol-client lockstep gate: regenerate the committed
      # wire-surface manifest from the canonical Go sources + assert the
      # tree is clean, run the Go lockstep test, and run the TS-source scan
      # (the hand-maintained Console interfaces must declare every manifest
      # type's fields). A Go wire change without a regenerated manifest, or
      # a hand-written TS client drifting from the wire shape, fails here.
      # The scan is stdlib node (no web/console npm install needed).
      - run: make protocol-ts-gen-check
      # `make docs` runs the VitePress build from the canonical in-repo
      # docs. A dead site-internal link is a build failure (the config's
      # ignoreDeadLinks carve-out covers only repo-tree pointers).
      - run: make docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/.vitepress/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # PR validation must never join this group: a global workflow-level
    # Pages group serializes or cancels unrelated pull-request builds. Only
    # deployments contend for the singleton Pages environment.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
