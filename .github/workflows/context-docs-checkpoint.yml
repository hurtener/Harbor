name: context documentation checkpoint

# One-shot, hash-bound documentation synchronization for PR 779.
# No model/runtime code, arbitrary patch payload, release, or secret access.
# Remove after the exact reviewed documentation is committed.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/context-docs-checkpoint.yml]
permissions:
  contents: read
jobs:
  docs:
    if: github.event.pull_request.number == 779 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/portable-session-context-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Synchronize the reviewed documentation only
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD^') != '5646c174df2f0b6c66050d3d4880a55dc8f87e99':
              raise SystemExit('Unexpected source revision; refusing synchronization')
          before = {
              'docs/decisions.md': 'ac0031a3f269460e71c70de9a370d6827a78fefc78316bed7934bbe9b3d567a5',
              'docs/plans/README.md': '7cc08a41cae145173bba376363f8e8128210f0dea4ba96e1ab186e18d45e0828',
              'RFC-001-Harbor.md': '07d72c31090d1df75d2c9bd324cd971e739f3bc656753d6cd9c67154f351dc75',
              'RFC-002-Session-Context.md': '37f6ecf268ed0e0fb26fc3899e00b331e3bfffa700dc6cf75d79734461d9bce3',
              'docs/rfc/README.md': 'ddade6feb32eb56706d7bcbca935f78c5547e025eb3c090b9cfe1d483febd2d5',
              'docs/glossary.md': 'f110fd7a493663f1bf5b11ffcd62e69ea4da1c74c497fe12d0780010de91f3bf',
              'docs/recipes/embed-harbor-headless.md': 'dd3d0790790de4496c6fac392bcf2825734a9859436d6105a27a6b297df2f426',
              'docs/notes/retained-context-progress.md': 'f0267be851a3b8e5d0e66b0cd18c68d642a11530757462f45cbf3fb12c0c8305',
          }
          after = {
              'docs/decisions.md': 'f88901272cfb0c1aff3cf044dd127c214d0e2ca88609cdf177762919ca5e2d7f',
              'docs/plans/README.md': '1e19e0324f57729f07f6c3ed572c26b10eef8fbc4b20388bef2f1b226903a978',
              'RFC-001-Harbor.md': 'db455908c3642fba9b4a4b229ebe4248f3afc31fb6d10a63dc2f24f368240a4e',
              'RFC-002-Session-Context.md': 'cfc8f920515eaf2edf6411b0d70d376900c137441d434a2e09d352e44eacb91d',
              'docs/rfc/README.md': 'e766863b9e6806d288f6952bd9ee6a19d600c88fdd84cf472d2c66139ca7c602',
              'docs/glossary.md': 'f117d66d7e22622321a875cf70f63c47b037717f32eea667b7ff469c3f3550a3',
              'docs/recipes/embed-harbor-headless.md': 'ad821aa8c81af8d5d7f7be583adcb77b91388425ad52436962546b930f08071d',
              'docs/notes/retained-context-progress.md': '885c15b1606b2c3151a05ecf0f5b9f4b885f78b8f1c344dca2fab72c0da41e9c',
          }
          for path, expected in before.items():
              if hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Source content changed: ' + path)
          def replace(path, old, new):
              p = pathlib.Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit('Ambiguous anchor: ' + path)
              p.write_text(text.replace(old, new, 1))
          def append(path, addition):
              p = pathlib.Path(path)
              old = p.read_text()
              if addition.strip() in old:
                  raise SystemExit('Already synchronized: ' + path)
              p.write_text(old.rstrip() + '\n\n' + addition.strip() + '\n')
          append('docs/decisions.md', '''## D-464 — Bounded retained execution context is an explicit opt-in

          **Date:** 2026-09-19. **Scope:** RFC 002, phase 269; incremental implementation.

          Embedded `RunOnce` calls may explicitly select `WithRetainedContext(1..32)`.
          Zero/omitted retains existing memory semantics and does not authorize richer
          persistence. The first consumer replaces legacy pair-only projection for that
          invocation with a bounded private execution window in the existing StateStore.
          Long-term memory stays external; completion ingestion hooks are not changed.

          Admission freezes prior terminal root context and uses the existing session
          pending/tombstone fences plus generation-conditional writes. In-flight sibling
          results are not imported. Own terminal evidence is redacted before persistence;
          raw diagnostic duplicates, reasoning traces, and live tool handles are excluded.
          Exact JSON numeric values and permitted source strings remain recoverable inside
          the retained window. Imported history is inert evidence, not execution authority,
          and is excluded from recursive retention and completion-hook ingestion.

          The initial bounds are 32 turns, 256 own steps per turn, 512 KiB per session slot,
          32 active admissions, and 32 conditional-write attempts. TTL follows the configured
          session idle TTL (24 hours when unspecified). Whole-turn expiry/eviction produces
          a partial-history notice; an indivisible oversized turn fails, never clips.
          Freezing membership does not extend source lifetime: expiry is checked before
          inference and before accepting its action. Erasure invalidates admission and
          prevents a stale terminal callback from resurrecting its content.

          This is explicitly the terminal-retention increment, not the complete RFC 002
          durability contract. Required writes can fail after external effects succeeded;
          the caller must reconcile instead of retrying blindly. Abandoned admissions
          remain uncertain and bounded, not automatically declared failed. Serve wiring,
          per-action intent/settlement persistence, historical native projection/checkpoint
          reuse, artifact recovery, and complete cross-driver acceptance remain pending.
          Consumer turn rows and best-effort observability retain their separate authority.
          No new backend, public transcript, native compaction, or cold-run relaunch.
          ''')
          replace('docs/plans/README.md',
              '|268 | Portable compaction and request budgets | 43, 45, 46, 111e | In progress — PR #779 |',
              '|268 | Portable compaction and request budgets | planner + steering + LLM | §6.2, §6.3, §6.5 | 43, 45, 46, 111e | request/race/adapter smoke; full gates pending | In progress — PR #779 |\n|269 | Retained session execution context | runctx + assembly + StateStore | §6.2, §6.9, §6.11 | 15, 16, 17, 246, 268 | embedded request + inmem/SQLite + 128-session race; full gates pending | In progress — embedded terminal retention only |')
          replace('docs/plans/README.md', '\n## Notes\n', '''
          ### Phase 269 — Retained session execution context

          - **Status:** In progress — PR #779, not released or RC-ready.
          - **Owner:** runtime/runctx + assembly + StateStore; RFC §6.2, §6.9, §6.11.
          - **Implemented increment:** explicit embedded `WithRetainedContext(1..32)`,
            bounded terminal evidence, exact JSON/source restoration, erasure/expiry guards,
            mandatory write errors, and no duplicate legacy-memory or completion ingestion.
          - **Pending:** serve wiring, per-action durability, native history/checkpoint
            reuse, artifact recovery, Postgres and full release gates. Terminal persistence
            does not establish crash-safe action settlement or an automatic recovery policy.
          - **Plan:** `docs/plans/phase-269-retained-session-context.md`; D-464.

          ## Notes
          ''')
          replace('RFC-001-Harbor.md', '### 6.9 Sessions and SessionManager\n', '''### 6.9 Sessions and SessionManager

          **Retained execution context (D-464; RFC 002).** Explicitly opted-in embedded
          runs may retain a bounded private terminal execution window through the existing
          StateStore. This replaces legacy pair-only projection for that invocation, not
          consumer turn rows or external long-term memory. Restored history is inert and
          must satisfy current erasure and source-expiry checks. Omitted configuration does
          not authorize new retention. Terminal-only retention is the first increment;
          per-action durability and serve integration remain required before phase 269 is
          complete. See [RFC 002](RFC-002-Session-Context.md) and the
          [phase 269 plan](docs/plans/phase-269-retained-session-context.md).
          ''')
          replace('RFC-002-Session-Context.md', '''Phase 268 implements the first slice. Its plan distinguishes completed
          checkpoints from the remaining budget and summarizer work. Later slices remain
          pending; this status does not claim durable session continuity or RC readiness.''', '''Phase 268 implements portable compaction and request budgeting. Phase 269 is in
          progress: its first embedded consumer retains exact terminal execution evidence
          under explicit opt-in. Serve integration, per-action durability and remaining
          acceptance are not yet complete. Neither phase is declared RC-ready.''')
          replace('RFC-002-Session-Context.md', '''This is a proposed scoped amendment to [RFC 001](RFC-001-Harbor.md), not a
          replacement for Harbor's architecture. It proposes changes to RFC §6.2''', '''This is an accepted scoped amendment to [RFC 001](RFC-001-Harbor.md), not a
          replacement for Harbor's architecture. It specifies changes to RFC §6.2''')
          replace('RFC-002-Session-Context.md', 'removed in this planning PR; new session continuity must not add another', 'removed by this work; new session continuity must not add another')
          replace('docs/rfc/README.md', '| [002](../../RFC-002-Session-Context.md) | Portable session context | Proposed — planning only |', '| [002](../../RFC-002-Session-Context.md) | Portable session context | Accepted — incremental implementation, not released |')
          append('docs/glossary.md', '''**Retained execution window** — an explicitly enabled, bounded private session
          projection in the existing StateStore, distinct from long-term memory, consumer
          turn rows, and authorization to repeat external actions. The initial embedded
          consumer stores own terminal evidence and imports prior retained turns as inert
          history. Whole-turn expiry/eviction is explicit; source lifetime and session
          erasure still constrain an admitted view. Per-action crash durability is separate
          pending acceptance, not implied by terminal retention. RFC §6.9, RFC 002, D-464.
          ''')
          replace('docs/recipes/embed-harbor-headless.md', '## 4. Run one goal\n', '''## Retain recent execution evidence across embedded calls

          On the incremental portable-context branch, explicitly opt each participating
          call into terminal retention. Reuse the same identity triple and configured
          StateStore; SQLite or Postgres is needed to retain content across process exits.

          ```go
          env, err := stack.RunOnce(ctx, "Edit the document from the previous turn.", id,
              assemble.WithRetainedContext(4))
          if err != nil {
              // A terminal write may fail after external effects succeeded.
              // Reconcile through the owning service; do not repeat the run blindly.
              return err
          }
          ```

          Omitted/zero leaves the existing memory and retention behavior unchanged. A
          positive value replaces legacy pair-only memory projection for that invocation;
          it does not introduce external-memory retrieval or duplicate completion-hook
          capture. Historical tool actions are supplied as inert evidence, not dispatched.

          This increment is embedded-only and terminal-only. Hard interruption may leave an
          admission with unknown outcomes; per-action recovery and serve configuration are
          not yet implemented. The window is limited to 32 turns, 256 own steps per turn,
          and 512 KiB, with the session idle TTL (24 hours when unspecified). Expiry and
          whole-turn eviction are disclosed; an oversized indivisible turn fails explicitly.
          See the [phase 269 plan](../plans/phase-269-retained-session-context.md).

          ## 4. Run one goal
          ''')
          replace('docs/notes/retained-context-progress.md', '''The phase smoke's D-464 reference is not yet a completed documentation gate.
          Do not mark the phase complete from terminal-only retention or these focused tests.''', '''The D-464 decision, master index, glossary, RFC status and embedding recipe now
          describe this increment and its boundaries. Do not mark the phase complete from
          terminal-only retention or focused tests; pending acceptance remains in its plan.''')
          for path, expected in after.items():
              if hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Output differs from reviewed documentation: ' + path)
          if set(git('diff', '--name-only').splitlines()) != set(after):
              raise SystemExit('Unexpected changed paths')
          subprocess.run(['git', 'add', '--', *after], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git', 'commit', '-m', 'docs(context): synchronize retained execution contract and embedding recipe'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/docs/portable-session-context-plan'], check=True)
          print('Verified documentation commit:', git('rev-parse', 'HEAD'))
