# Harbor — example configuration. Copy and adapt; values shown here
# are reasonable defaults for a local-dev binding. Production
# deployments should override jwks_url, llm.api_key, and any
# governance ceilings to match the operator's policy.

server:
  bind_addr: 127.0.0.1:8080
  shutdown_grace_period: 30s

identity:
  jwt_algorithms:
    - RS256
    - ES256
  issuer: https://issuer.example.com
  audience: harbor
  jwks_url: https://issuer.example.com/.well-known/jwks.json
  # Max-stale ceiling: omit (or 0) for the safe default (1h). Past this
  # age without a successful refresh the verifier fails closed instead of
  # serving a possibly-revoked key. Negative / below-1m values rejected.
  # jwks_max_stale: 1h

telemetry:
  log_format: json
  log_level: info
  service_name: harbor

# v1.29.1 runtime-wide PostgreSQL budget. Equal subsystem DSNs share one pool;
# distinct legacy DSNs still share this aggregate cap during the staged first
# boot. All fields are restart-required.
postgres:
  pool:
    max_open: 3
    max_idle: 1
    conn_max_lifetime: 5m
    conn_max_idle_time: 30s

state:
  driver: inmem
  # Postgres only. Empty/omitted = apply (direct/session-capable endpoint).
  # After a separate direct apply succeeds, point dsn at a transaction pool
  # and set verify: startup reads the ledger only and fails if it is stale.
  # migration_mode: verify

llm:
  # `bifrost` (Phase 33 — pure-Go gateway against OpenAI / Anthropic /
  # Google / OpenRouter / etc.) is the production default Phase 64
  # (D-089) flipped to. The `mock` driver (Phase 32 — test-grade, no
  # network) is reachable ONLY via the `HARBOR_DEV_ALLOW_MOCK=1` env
  # var when running `harbor dev` (the §13 dev-only escape hatch).
  driver: bifrost
  # Bifrost knobs — required when `driver: bifrost`. The mock driver
  # ignores these.
  #
  # The `api_key` field accepts a literal key OR an `env.NAME`
  # reference. Production deployments use `env.NAME` so secrets stay
  # out of the repo (Phase 33 fails closed at boot with
  # `ErrMissingAPIKey` if the named env var is unset).
  provider: openrouter
  model: anthropic/claude-sonnet-4
  # Production: `api_key: env.OPENROUTER_API_KEY` (Phase 33 resolves
  # at New time via os.Getenv).
  api_key: replace-me
  timeout: 60s
  # Context-window safety margin (Phase 32 / D-026). The LLM-edge
  # safety pass fails with ErrContextWindowExceeded when the
  # estimated token count of an assembled CompleteRequest is within
  # this fraction of the model's configured `context_window_tokens`
  # cap. Range [0, 1). Default 0.05 (5%).
  context_window_reserve: 0.05
  # Per-model knobs. The safety pass REQUIRES an entry for every
  # model that appears in a CompleteRequest; missing profiles
  # surface as ErrUnsupportedModel at request time.
  model_profiles:
    anthropic/claude-sonnet-4:
      # Hard input-token cap; the safety pass's token-budget guard
      # reads this and applies `context_window_reserve` to it.
      context_window_tokens: 200000
      # Estimator algorithm. "" or "chars_div_4" — default
      # chars/4 + per-message overhead.
      token_estimator: chars_div_4
      # Phase 35 — structured-output strategy. Allowed values:
      #   ""         → fall back to per-known-provider default
      #                 (OpenAI/Anthropic/Google → "native";
      #                  NIM/custom OpenAI-compat → "prompted";
      #                  o1/o3/deepseek-reasoner → "prompted")
      #   "native"   → pass FormatJSONSchema through to the provider
      #   "tools"    → Harbor-side prompted envelope (NOT provider
      #                tool-calling APIs); runtime parses locally
      #   "prompted" → FormatJSONObject + schema in system prompt
      # The downgrade chain `native → prompted → text` fires on
      # `IsInvalidJSONSchemaError` failures.
      json_schema_mode: native
      # Phase 36 — caps the validator-driven retry-with-feedback loop
      # for this model. 0 (default) → DefaultMaxRetries (1). The
      # wrapper is a no-op when `req.Validator` is nil.
      # max_retries: 1
      # Phase 36b reads — identity-tier MaxTokens default.
      # default_max_tokens: 4096
      # Phase 33 routes — "off" / "low" / "medium" / "high" / "".
      reasoning_effort: low
      # Phase 36a fallback — per-1M-token rates when the provider
      # doesn't report cost (some OpenRouter routes don't).
      # cost_overrides:
      #   input_per_1m_tokens: 3.0
      #   output_per_1m_tokens: 15.0
      #   currency: USD
    google/gemini-3.1-flash-lite:
      context_window_tokens: 1000000
      token_estimator: chars_div_4
      json_schema_mode: native
      reasoning_effort: ""
      # Phase 34 per-provider correction overrides (optional). The
      # corrections layer infers sensible defaults from the model
      # name prefix; this block lets the operator override per model.
      #
      # corrections:
      #   message_ordering: ""             # "" / "system_first_strict" (NIM)
      #   schema_mode: ""                  # "" / "openai_strict" / "permissive"
      #   reasoning_effort_routing: ""     # "" / "thinking_model" (o1/o3/deepseek-reasoner)
      #   response_format_shape: ""        # "" / "json_only" / "anthropic"
      #   usage_backfill_enabled: false    # synth tokens+cost when provider reports 0/0
  # Phase 34 — per-provider correction layer toggle. Enabled by
  # default (operators who omit this block get production-correct
  # behaviour). Set `enabled: false` only for tests that need to
  # exercise the safety pass in isolation.
  #
  # corrections:
  #   enabled: true

  # Phase 33a — custom OpenAI-compatible providers. Lets operators
  # wire NIM, vLLM, ollama, lm-studio, or any other OpenAI-compatible
  # endpoint without per-provider Go code. Set `llm.provider` to a
  # custom provider's `name` and bifrost routes traffic through the
  # custom configuration (the legacy `llm.api_key` / `llm.base_url` /
  # `llm.timeout` fields are ignored in that case).
  #
  # IMPORTANT URL gotcha: bifrost's OpenAI provider appends
  # `/v1/chat/completions` to `base_url`. NIM's host
  # (`https://integrate.api.nvidia.com`) is the right BaseURL form;
  # for endpoints whose URL already includes `/v1` use
  # `request_path_overrides` to set the suffix to `/chat/completions`.
  #
  # custom_providers:
  #   - name: nim
  #     base_url: https://integrate.api.nvidia.com
  #     # The env var NAME (no `env.` prefix); the driver resolves
  #     # os.Getenv(name) at New time. Missing env var → fail closed
  #     # at boot.
  #     api_key_env_var: NVIDIA_API_KEY
  #     models:
  #       - google/gemma-4-31b-it
  #     # NIM cold-start latency can exceed 60s; 180s is a conservative
  #     # default. Operators can tune per-deployment.
  #     timeout: 180s
  #     max_retries: 2
  #     retry_backoff_initial: 500ms
  #     retry_backoff_max: 5s
  #     # base_provider_type defaults to "openai" (Phase 33a only
  #     # supports OpenAI-compatible). Future phases widen.
  #     # base_provider_type: openai
  #     # Optional — override bifrost's default URL paths when the
  #     # endpoint diverges from OpenAI's path scheme. Keys are
  #     # bifrost RequestType strings ("chat_completion", etc.).
  #     # request_path_overrides:
  #     #   chat_completion: /chat/completions
  #
  # network_defaults:
  #   # Defaults applied to every provider (native + custom) when the
  #   # per-provider override is absent. Zero-valued fields fall
  #   # through to bifrost's package-level defaults.
  #   timeout: 60s
  #   max_retries: 3
  #   retry_backoff_initial: 500ms
  #   retry_backoff_max: 5s
  #   concurrency: 3
  #   buffer_size: 10

  # Inference-plane broker-pull credential source (D-333). By default the
  # primary provider's key resolves from `api_key` (env / literal) once at
  # boot — the LOCAL source. Set `credential_source: remote` to instead PULL
  # the key from a NAMED, boot-declared inference broker at connect + refresh
  # (never on the per-call hot path — the pulled key rides the atomic
  # key-swap). Brokered XOR local: a `remote` primary MUST name an
  # `inference_brokers[]` entry AND leave `api_key` empty (both set, or
  # neither, is a boot error). Fail-loud: a broker unreachable at connect or a
  # failed refresh raises `ErrProviderKeyUnavailable` — never a silent
  # fallback to a local key, never a stale key served past its refresh
  # contract.
  #
  # credential_source: remote        # "" / "local" (default) or "remote"
  # inference_broker: openai-broker  # names an inference_brokers[] entry
  #
  # inference_brokers:
  #   # Boot-declared, config/file-only inference-broker(s) — the pinned
  #   # credential SINK for a runtime's LLM provider key (the D-300 analogue
  #   # of tools.oauth_credential_brokers). Referenced by non-secret NAME
  #   # from `credential_source: remote` above and from the
  #   # `agent_config.set_llm_provider` zero-URL Protocol write. No URL or
  #   # secret ever crosses the wire. Restart-required; NOT a Protocol surface.
  #   - name: openai-broker
  #     # The coordinator credential-pull endpoint (https; loopback allowed
  #     # for dev/fixtures). The runtime GETs the provider key here.
  #     credential_url: https://coordinator.example.com/runtimes/self/provider-key
  #     # Env var holding the runtime's OWN broker credential (the Bearer
  #     # presented to credential_url; §7 rule 2 — never hardcoded).
  #     auth_token_env: HARBOR_COORDINATOR_TOKEN
  #     # Optional boot-pinned audience / scope ceiling (an LLM provider key
  #     # is not always audience/scope-shaped; omit when the broker's own
  #     # binding governs).
  #     # audience: openai
  #     # scope_ceiling: [chat]
  #     # cache_ttl: 5m   # caps the in-memory serve horizon (default 5m)
  #     # timeout: 10s    # bounds a single pull (default 30s)

# Runtime run-lifecycle hooks.
#
# The run-completion hook fires exactly once at the run loop's terminal
# boundary (every terminal outcome — goal, no-path, constraints-conflict,
# cancelled, error — never mid-run or on pause) and dispatches the run's
# transcript to a named catalog tool through the normal tool-execution path.
# It is meant for memory / audit / analytics sinks that need the full
# conversation for runs no client observes (background / disconnected runs).
# A hook failure NEVER alters the run outcome (it emits `run.hook_failed` +
# a Warn log). The target tool need not be exposed to the planner — the
# executor resolves it against the full catalog. Leave `tool` empty to
# disable; the per-agent, versioned agent-config `hooks` section can still
# enable it. Resolution at run start: agent-config over this yaml over none.
# runtime:
#   hooks:
#     run_completion:
#       tool: run_transcript_sink   # catalog tool name; empty disables
#       timeout: 10s                # detached-dispatch bound (default 10s)
#
#   # Session auto-naming (D-289) — OPT-IN, default OFF. With this block
#   # absent (or `auto: false`) the runtime writes no naming counters, makes
#   # no naming LLM calls, and emits no naming events. When on, the runtime
#   # titles a session itself at each run's terminal boundary via ONE governed
#   # `Complete` call over a bounded transcript digest; a naming failure never
#   # alters the run outcome (it emits `session.naming_failed` + a Warn log).
#   # A per-agent agent-config `naming` section overrides this fleet default.
#   naming:
#     auto: true                    # false (default) = off
#     after_turns: 1                # first auto-name after N completed runs (default 1)
#     repeat_every: 0               # 0 = name once; >0 re-names every N turns
#     max_repetitions: 5            # REQUIRED >=1 when repeat_every > 0 (no unlimited value)
#     max_title_len: 80             # rune bound [8,200] (default 80); auto output is clamped
#     model: ""                     # empty = the run's effective model; else a model_profiles key

governance:
  repair_attempts: 3

  # Phase 36a + 36b — identity tier policy declarations.
  #
  # **ENFORCED** (Phase 111a, D-198): a populated `identity_tiers`
  # block composes the enforcement subsystem at boot — cost ceilings
  # fire (`ErrBudgetExceeded` + `governance.budget_exceeded`), rate
  # limits drain (`ErrRateLimited` + `governance.rate_limited`), and
  # MaxTokens caps reject (`ErrMaxTokensExceeded` +
  # `governance.maxtokens_exceeded`). The same block also drives the
  # read-only `governance.posture` Protocol surface.
  #
  # **LATENT DEFAULT (D-044).** With the `identity_tiers` block
  # omitted (or `default_tier` empty), the surface is fully latent —
  # no enforcement, no governance wrapper in the LLM chain.
  #
  # **CONFIG-DEFAULT LAYER (D-332).** This block is the *default* layer
  # the admin-write `governance.set_posture` Protocol method layers over.
  # A runtime with no written override enforces exactly what is declared
  # here; an admin `set_posture` write replaces the whole tier table live
  # (StateStore-backed, no redeploy) and the read-only `governance.posture`
  # then reflects the written record. A write that omits or zeroes a
  # currently-enforced ceiling is rejected fail-closed — never
  # budget-widening.
  #
  # **Removed in D-081.** The pre-Phase-36a single-knob fields
  # `default_max_tokens`, `cost_ceiling_usd`, and `rate_limit_tps`
  # are no longer accepted on this block. They were validated-but-
  # ignored stubs — the enforcement engine has only ever consumed
  # `identity_tiers`. The loader emits a structured
  # `config.deprecated_field` slog warning when any of those keys
  # appears in YAML, drops the value, and proceeds. Migrate by
  # building a `default` tier with the equivalent values:
  #
  # default_tier: default
  # identity_tiers:
  #   default:
  #     max_tokens: 4096       # was governance.default_max_tokens
  #     budget_ceiling_usd: 0  # was governance.cost_ceiling_usd
  #     # rate_limit_tps had no direct equivalent; the token-bucket
  #     # shape below (capacity + refill) is the new model.
  #
  # Each tier's fields are INDEPENDENTLY opt-in — set
  # `budget_ceiling_usd` only to enforce cost ceilings, leave
  # `rate_limit` and `max_tokens` zero to leave those latent.
  #
  # default_tier: free
  # identity_tiers:
  #   free:
  #     budget_ceiling_usd: 1.00
  #     max_tokens: 1000
  #     rate_limit:
  #       capacity: 100000
  #       refill_tokens: 50000
  #       refill_interval: 1h
  #   team:
  #     budget_ceiling_usd: 50.00
  #     max_tokens: 4000
  #     rate_limit:
  #       capacity: 1000000
  #       refill_tokens: 500000
  #       refill_interval: 1h
  #   enterprise:
  #     budget_ceiling_usd: 1000.00
  #     max_tokens: 16000
  #     # No rate_limit — enterprise tier is unbounded.

events:
  # `inmem` (Phase 05/06 — in-process bus + ring-buffer replay) or
  # `durable` (Phase 57 — StateStore-backed event log with exact,
  # gap-free replay that survives a Runtime restart).
  driver: inmem
  # Per-session subscriber cap. The 17th subscribe in the same
  # (tenant, user, session) returns ErrSubscriberLimitReached.
  max_subscribers_per_session: 16
  # Per-subscriber buffer; on overflow the oldest event is dropped
  # and a bus.dropped event lands in the subscriber's stream.
  subscriber_buffer_size: 256
  # A subscription whose Events() channel hasn't been drained for
  # this long is reaped and emits bus.subscription_idle_closed.
  idle_timeout: 60s
  # At most one bus.dropped event per subscriber per drop_window
  # — windows the drop notifications under saturation.
  drop_window: 1s
  # Ring-buffer capacity for replay. On the `inmem` driver this is
  # the replay ring (0 disables replay). On the `durable` driver it
  # sizes ONLY the best-effort fallback ring used when no StateStore
  # is configured.
  replay_buffer_size: 10000
  # StateStore selection for the `durable` driver — OPTIONAL and
  # ignored by every other driver. When driver=durable and
  # state_driver is empty, the durable driver auto-degrades to a
  # best-effort in-memory ring buffer and emits a LOUD runtime.warning
  # (replay is then NOT durable across restarts — D-074). state_dsn
  # is required whenever state_driver is sqlite or postgres.
  #   state_driver: sqlite
  #   state_dsn: /var/lib/harbor/events.db
  # v1.29.0 -> v1.29.1 durable upgrade only: set true only after every old
  # event-writing Runtime sharing this StateStore has stopped. Ordinary
  # rolling replacement is unsafe; use stop-before-start/suspend-resume.
  # Migration-only processes are not event writers.
  #   legacy_writers_drained: true

artifacts:
  # `inmem` (per-process, dev/embedded floor), `fs` (single-binary
  # production target), `sqlite` (Phase 18 — durable, single-node),
  # `postgres` (Phase 18 — durable, multi-replica safe), or `s3`
  # (Phase 19 — S3-compatible: AWS / MinIO / Cloudflare R2 / GCS-
  # compat).
  driver: inmem
  # Required when driver=fs; the root directory under which the
  # `<root>/<tenant>/<user>/<session>/<task>/<namespace>/<id>` blob
  # tree lands. Created (`os.MkdirAll`) at boot.
  # fs_root: /var/lib/harbor/artifacts
  # Required when driver=sqlite or driver=postgres. SQLite accepts a
  # bare file path (or `:memory:` for the degenerate dev case);
  # Postgres accepts a standard URL form
  # (`postgres://user:pass@host:5432/db?sslmode=disable`) or pgx
  # key-value form. Override via HARBOR_ARTIFACTS_DSN in production;
  # never commit a real password.
  # dsn: /var/lib/harbor/artifacts.sqlite
  # Postgres only; see state.migration_mode above. The same apply/verify
  # rollout contract also exists at memory.migration_mode,
  # skills.migration_mode, sessions.turns.migration_mode, and
  # observability.rollups.migration_mode.
  # migration_mode: apply
  # Heavy-output threshold: payloads at or above this byte size that
  # are bound for a MODEL'S CONTEXT WINDOW are mandatorily routed
  # through the ArtifactStore (D-022, D-358, RFC §6.5 / §6.10).
  # Default 131072 (128 KiB). Runtime-wide invariant — there are no
  # per-tool overrides.
  #
  # It does NOT govern Console-facing Protocol replies: `pause.list`,
  # `memory.get` / `memory.list`, the flow catalog and the
  # `mcp.apps.*` reads select inline-versus-reference at a pinned
  # 32 KiB bound that does not track this knob (D-358). Raising this
  # widens what a planner may see inline; it does not widen a
  # browser-facing reply.
  heavy_output_threshold_bytes: 131072
  # The read-back bound. `heavy_output_threshold_bytes` above governs
  # what GOES OUT to the store; these two govern what COMES BACK, and
  # they are meant to be tuned as the pair they are. Both the
  # `artifacts.get` Protocol method and the `artifact_fetch` builtin the
  # model calls answer to them.
  #   fetch_default_max_bytes — the window served when the caller names
  #                             no bound of its own. Default 64 KiB.
  #   fetch_hard_max_bytes    — the ceiling a caller's own bound is
  #                             clamped to. Default 1 MiB.
  # A request above the ceiling is SERVED AT THE CEILING and reports it
  # through the response's `truncated` / `total_size_bytes` /
  # `returned_bytes` fields — deliberately not a refusal, because a
  # caller cannot know a deployment's ceiling before asking. Truthful
  # truncation is the posture; silent truncation is what the fail-loud
  # rule forbids.
  # The guarantee is bounded and says so: the ceiling bounds ONE read.
  # It is NOT a budget over repeated reads — the governance layer's cost
  # ceilings and rate limits remain the mechanism for aggregate
  # consumption.
  fetch_default_max_bytes: 65536
  fetch_hard_max_bytes: 1048576
  # S3-style driver fields (Phase 19). Required when driver=s3:
  #   s3_bucket — the bucket; the driver does NOT create it (operator
  #               provisions out of band). HeadBucket runs at boot to
  #               surface misconfigs early.
  #   s3_endpoint — base URL for non-AWS backends (MinIO / R2 / GCS S3
  #                 compat). Leave empty for AWS-native deployments.
  #   s3_region — defaults to us-east-1 when unset (covers MinIO + plain R2).
  #   s3_prefix — optional path prefix so multiple Harbor deployments
  #               can share one bucket.
  #   s3_access_key_id / s3_secret_access_key — when both empty, the
  #               SDK's default credential chain applies (env vars, IRSA,
  #               instance metadata, ~/.aws/credentials).
  #   s3_use_path_style — flip on for MinIO / older R2 endpoints; AWS
  #                       native deployments leave this off.
  # s3_bucket: harbor-artifacts
  # s3_endpoint: https://s3.amazonaws.com
  # s3_region: us-east-1
  # s3_prefix: harbor
  # s3_access_key_id: replace-me
  # s3_secret_access_key: replace-me
  # s3_use_path_style: false

tasks:
  # TaskRegistry driver. One of:
  #   inprocess (default) — in-memory registry; live state is
  #     observable but a runtime restart starts empty.
  #   durable — persists task/group/patch records through the
  #     StateStore so they survive a restart. On open it replays every
  #     record and runs a recovery sweep (a task left `running` by a
  #     crash becomes `failed` with code `runtime_restarted`; the
  #     record is recovered, execution is not re-driven). Reuses the
  #     runtime StateStore — no extra config. For survival across a
  #     real process restart, pair with a durable state.driver
  #     (sqlite/postgres); with state.driver: inmem records survive
  #     only an in-process driver reopen. Selecting durable with no
  #     StateStore wired fails loudly at boot.
  driver: inprocess
  # Phase 21 backgroundtasks-config knobs (RFC §6.8). Both fields
  # must be > 0; defaults are applied when the section is omitted.
  retain_turn_timeout: 5m
  continuation_hop_limit: 8

pauseresume:
  # Phase 111c (D-200) — the pause lifecycle. `max_park_duration` is
  # the ceiling on how long a pause (HITL approval, tool-side OAuth,
  # an awaited external event) may stay parked before the runtime's
  # pause sweeper resumes it with the typed `timeout` Decision
  # (`pause.resumed`, D-096) and the waiting run terminates as a
  # constraints-conflict. 0 (the default) = pauses never expire and
  # the sweeper is not started. Must be >= 0.
  max_park_duration: 0s
  # Sweeper scan cadence — consumed only when `max_park_duration` > 0.
  # Default 1m (0s = the default applies); when expiry is enabled it
  # must be <= `max_park_duration` so a pause can't overstay its
  # deadline by more than one sweep.
  sweep_interval: 1m

memory:
  # MemoryStore driver — Phase 23 shipped `inmem`; Phase 25 adds
  # `sqlite` and `postgres` (durable across restart). Default
  # `inmem`.
  driver: inmem
  # DSN — required when driver is `sqlite` or `postgres`. SQLite
  # accepts a bare file path (or `:memory:` for the degenerate dev
  # case); Postgres accepts a standard URL form
  # (`postgres://user:pass@host:5432/db?sslmode=disable`) or pgx
  # key-value form. Override via HARBOR_MEMORY_DSN in production;
  # never commit a real password.
  # dsn: /var/lib/harbor/memory.sqlite
  # migration_mode: apply # Postgres only; verify after a separate direct apply.
  # Memory shape strategy:
  #   - `none`            — AddTurn is a no-op; GetLLMContext returns empty.
  #   - `truncation`      — recent-turn window + budget enforcement (drop-oldest).
  #   - `rolling_summary` — recent window + background-summarised long-term
  #                         context. Health FSM observable via
  #                         `memory.health_changed`. Requires an injectable
  #                         Summarizer (LLM-backed at Phase 32+; not
  #                         registry-reachable today).
  strategy: none
  # Per-key token cap for truncation and rolling_summary; zero
  # disables budget enforcement (turns accumulate unbounded). When
  # set, rolling_summary keeps the recent-turn set verbatim and
  # recursively compacts older turns into the rolling summary (folding
  # into — never discarding — prior summary content) until the
  # assembled context fits this budget.
  budget_tokens: 0
  # Number of most-recent conversation turns rolling_summary keeps
  # verbatim before older turns spill into the rolling summary.
  # 0 → strategy default (FullZoneTurns = 4). Must be >= 0. Ignored by
  # the `none` and `truncation` strategies.
  recent_turns: 0
  # Operator-tunable compaction summariser (rolling_summary only).
  # `model` pins the model used for compaction LLM calls, independent
  # of the planner's model — set it to a cheaper/faster model to keep
  # compaction cheap. Unset → the main LLM's default model (today's
  # behavior). A model with no `model_profiles` entry fails at runtime
  # like any unsupported model. `prompt` is APPENDED to the baseline
  # summariser system prompt behind an "extend, do not override"
  # separator — it never replaces the baseline role framing or
  # conciseness guarantees. Unset → baseline prompt only (no change).
  # summarizer:
  #   model: anthropic/claude-haiku
  #   prompt: "Always preserve numeric thresholds and dollar amounts verbatim."
  # Bounded queue size for the rolling_summary recovery loop
  # (D-034). Overflow drops oldest and emits
  # `memory.recovery_dropped` on the events bus. Default 16; must
  # be >= 0.
  recovery_backlog_max: 16
  # Opt-in retrieval mode (Phase 84d — D-191), layered ON TOP of the
  # strategy. `semantic` embeds turns at AddTurn and serves
  # similarity search via MemoryStore.SearchTurns, COMPOSING with
  # rolling_summary (never replacing it). Requires the `embeddings`
  # block above. Vectors persist through the configured StateStore
  # (all three drivers; brute-force cosine at V1 scale).
  # retrieval: semantic
  # Result cap for a semantic SearchTurns when the caller passes no
  # limit. 0/unset → 5.
  # retrieval_top_k: 5
  # Cosine-similarity floor: turns below this score are skipped.
  # Range [-1, 1]. Ignored unless retrieval = "semantic".
  # retrieval_min_score: 0.0

# D-103 — Planner driver selection (closes issue #126). The §4.4 seam
# pattern that D-095 uses for OAuth providers, applied to the planner
# concrete. V1 ships only the `react` driver (the reference LLM-driven
# ReAct concrete from Phase 45 / D-051). Future drivers (Plan-Execute,
# Workflow, Graph, Deterministic, Supervisor, MultiAgent, HumanApproval
# per RFC §6.2) self-register under `internal/planner/<name>/` + a
# blank import in `cmd/harbor/main.go`; flip `driver:` to opt in.
#
# `max_steps` overrides the driver-side circuit-breaker step cap. Zero
# (the default) means "use the driver's internal default" —
# `react.DefaultMaxSteps` (12) for the V1 reference driver. Raise for
# longer trajectories; lower to fail fast in tests.
#
# `extra_guidance` (Phase 83a, RFC §6.2) is operator-supplied
# domain-specific guidance injected verbatim into the rendered ReAct
# system prompt's `<additional_guidance>` section — voice/tone rules,
# domain interpretation hints, when-to-use-which-tool steering. Omit
# the key (the default) and the section is left out of the prompt
# entirely. The validator imposes no rule beyond "string"; the
# operator owns the content. Only the `react` driver consumes it.
#
# `reasoning_replay` (Phase 83e — D-148) controls whether a prior
# step's captured provider-side reasoning trace is re-injected into the
# next turn's prompt. Two values:
#   - `never` (the DEFAULT for ALL models; empty resolves here) — a
#     prior step's captured reasoning is never replayed; the next
#     prompt sees only the prior `{tool, args}` action JSON.
#   - `text` — the trajectory renderer prepends each prior step's
#     captured reasoning trace as a text block above the action JSON.
#     Per-agent opt-in for workloads that benefit from CoT continuity;
#     note it grows prompt size on chatty trajectories.
# There is no `provider_native` mode in V1.
#
# `max_tool_examples_per_tool` (Phase 83b — D-144) caps how many curated
# examples the rendered `<available_tools>` section emits per tool.
# Examples are ranked `minimal` > `common` > `edge-case` > untagged; the
# renderer keeps the top N. Zero / unset resolves to 3. Dial it down for
# catalogs with many tools to keep prompt token usage bounded.
#
# `parallel_tool_calls` (Phase 107d — D-169) toggles native parallel
# tool-call dispatch. Default true (omit the key): when the LLM returns
# several tool-calls in one turn, the React planner emits a native
# `CallParallel` and the runtime dispatches the branches concurrently.
# Set false to revert to the 107c serialization fallback (one tool-call
# per step). Both paths are correct; true is the intended end state.
#
# `skills_context_max` (Phase 83f — D-149) caps how many skill bodies
# the dev binary's per-task run loop fetches from `SkillStore.Search`
# and hands the planner via `RunContext.SkillsContext`. Zero / unset
# resolves to 5. Only consumed by the dev binary; library consumers
# that build their own RunContext are unaffected.
#
# `planning_hints` (Phase 83f — D-149) is the operator-supplied per-run
# planning steering the dev binary projects onto `RunContext.PlanningHints`.
# The ReAct planner renders the contents into `<planning_constraints>`
# via 83c's prompt section. V1.1 ships two YAML fields:
#   - `constraints` (string)         — free-form rules / negative space
#   - `preferred_tools` (list[str])  — names the planner prefers
# The richer Go-struct fields (ParallelGroups, DisallowTools, Budget)
# stay reachable via a custom planner Option but not via this YAML
# surface. Omit the block entirely and the section is left out of the
# prompt.
#
# Reasoning-capture note for Anthropic: Anthropic's extended-thinking
# API requires `reasoning.max_tokens >= 1024`. Harbor maps the LLM
# `reasoning_effort` enum to a budget for the Anthropic provider and
# FAILS LOUDLY (it does NOT silently clamp) when the resulting budget
# is below the floor — `reasoning_effort: low` against an Anthropic
# model is rejected at request-translation time. Use `medium` or
# `high` for Anthropic reasoning, or `off` to disable it.
planner:
  driver: react
  # max_steps: 12
  # extra_guidance: |
  #   Answer in formal English. When the answer is tabular data,
  #   call render_table before finishing and reference the artifact
  #   in your final answer.
  # reasoning_replay: never   # never (default) | text
  # parallel_tool_calls: true       # default true; false → serialise N>1 tool-calls (107c fallback)
  # max_tool_examples_per_tool: 3   # 0/unset → 3
  # skills_context_max: 5            # 0/unset → 5; cap on SkillStore.Search results per run
  # token_budget: 0                  # 0/unset → trajectory compression OFF (Phase 111e / D-202).
  #                                  # When > 0: once the trajectory's token estimate exceeds this
  #                                  # budget, the runtime invokes the LLM-backed trajectory
  #                                  # summariser and the compacted five-field summary replaces the
  #                                  # raw step history in subsequent prompts (one compression per
  #                                  # run, no auto-cascade; requires the llm block).
  # planning_hints:
  #   constraints: |
  #     Never call external download tools without confirming the URL
  #     resolves to an allowed source.
  #   preferred_tools:
  #     - youtube_get_metadata
  #     - http_get

# Phase 84b (D-189) — per-agent attachment disposition policy. The
# block is OPTIONAL — omit it and the runtime default applies
# (`image/*` → inline DataURL, everything else → an `ArtifactStub`
# with a `Fetch.Tool` hint the planner drives via tool-calling).
# Keys: an exact media type, a `family/*` wildcard, or the literal
# `*` (the agent-wide default). Values: ref | inline |
# provider_native | tool:<name>. A per-attachment Protocol
# `disposition` hint on `start` overrides this map per upload.
# multimodal:
#   disposition:
#     # Route PDFs to a catalog tool instead of the provider:
#     "application/pdf": "tool:pdf.extract"
#     # Keep the sub-threshold image fast path explicit:
#     "image/*": inline
#     # Agent-wide default for everything else:
#     "*": ref

# Phase 37 skills subsystem (RFC §6.7). The block is OPTIONAL — omit
# it entirely and skills stay uninitialised. When set, both `driver`
# and `dsn` are required.
# skills:
#   # SkillStore driver. Harbor ships two backends at three-driver
#   # parity (RFC §9):
#   #   - `localdb` (default) — CGo-free SQLite with the FTS5 → regex →
#   #     exact ranking ladder. A per-instance file; ideal for single-
#   #     node / embedded deployments.
#   #   - `postgres` — shared, durable Postgres (`pgx`) for multi-
#   #     instance deployments where every replica must see the same
#   #     skills catalog. Same conflict policy, identity scoping, and
#   #     ranking ladder as `localdb` (proven by the shared conformance
#   #     suite); the full-text tier rides a `tsvector` + GIN index.
#   driver: localdb
#   # DSN — required for both drivers. `localdb` (SQLite) accepts a
#   # bare file path (or `:memory:` for the degenerate dev case).
#   # `postgres` takes a libpq/pgx connection string. Override via
#   # HARBOR_SKILLS_DSN in production; never commit a real DSN with
#   # sensitive metadata (the value is `secret:"true"` — redacted in
#   # audit logs).
#   dsn: /var/lib/harbor/skills.sqlite
#   # migration_mode: apply # Postgres only; verify after a separate direct apply.
#   # Postgres variant (durable / shared, multi-instance):
#   #   driver: postgres
#   #   dsn: postgres://harbor:${HARBOR_SKILLS_PG_PASSWORD}@db:5432/harbor?sslmode=require
#   # Phase 111d (D-201) — the skills virtual directory: the bounded,
#   # pinned-then-recent, capability-filtered browse window the run
#   # loop injects as the per-turn `<skills_context>` prompt block.
#   # All fields optional. Ingest skills with `harbor skill import`.
#   directory:
#     # Skill names anchored first in every view, declaration order.
#     # Pinning is ordering only — never a capability-filter bypass.
#     pinned:
#       - triage-incident
#     # View length cap. 0/unset → planner.skills_context_max
#     # (default 5); explicit values must be in [1, 200].
#     max_entries: 10
#     # Unpinned ordering: `pinned_then_recent` (default; UpdatedAt
#     # DESC). `pinned_then_top` (UseCount DESC) is NOT YET WIRED —
#     # no production path increments usage counters, so the
#     # validator rejects it loud until usage tracking lands.
#     selection: pinned_then_recent
#   # Opt-in `skill_search` ranking mode (Phase 84d — D-191).
#   # `semantic` ranks by embedding similarity over the
#   # identity-scoped catalog (result path "semantic") instead of the
#   # FTS5 → regex → exact ladder. Requires the `embeddings` block.
#   # Capability filtering, redaction, and the budgeter apply
#   # unchanged on top.
#   retrieval: semantic
#   # Phase 248 (D-427) — node-local boot agent packs (the v1.28
#   # contract). Each entry names exactly ONE (tenant_id, agent_id)
#   # pair; the skills block must be configured (driver + dsn).
#   # Packs are node-local: Postgres persists revision/personal
#   # state, but each node reloads its own pack files at boot and
#   # never converges replicas. `directory` is relative to THIS
#   # FILE's directory, never the CWD; one `include` entry = one
#   # package directory with exactly one case-sensitive top-level
#   # regular UTF-8 `SKILL.md` (resource-free in v1.28). Strict
#   # loader — symlinks, hardlinks, special files, traversal,
#   # duplicates, and out-of-bounds all fail boot loud. Eager
#   # immutable load before readiness; restart-only changes. Read-
#   # only: no writes, no admin verbs, no lifecycle, no new agents /
#   # reach; separate from EnsureBootAgentLifecycle (which may still
#   # write revisions). Boot + revision items are ONE operator tier,
#   # resolved last; same hash in both = dedup, different hash =
#   # conflict; combined 256 cap. Boot-owned names are read-only at
#   # every mutation surface: new writes / upserts / proposal commit /
#   # rollback / activation targeting a boot-owned canonical name fail
#   # with a typed boot-owned conflict even for the same hash; removal
#   # may delete a real legacy active-revision shadow, but a boot-only
#   # removal returns a typed read-only refusal and never removes the
#   # boot contribution. Preview provenance is the exact closed set
#   # boot / revision / both, with the per-package semantic content
#   # hash plus the deterministic boot_pack_set_hash of the loaded
#   # pack set (node-local — never converged via Postgres). Headless
#   # RunOnce is unsupported — fails loud, never silently runs without
#   # packs.
#   driver: postgres
#   dsn: ${SKILLS_DSN}
#   boot_agent_packs:
#     - tenant_id: acme
#       agent_id: harbor-dev-agent
#       directory: /etc/harbor/skills
#       include:
#         - workbench-foundation
#         - workbench-prototype-authoring
#         - workbench-brand-identity
#         - workbench-deck-authoring
#   Phase 250 (D-430) — organization skill publications are managed through
#   the additive `skills.publications.*` Protocol methods, not this YAML block.
#   Publication metadata, exact references, and receipts are content-free;
#   only the same-runtime composition resolver may return a body after signed
#   effective-agent reach, lifecycle, hash, generation, and runtime checks.
#   Configure the existing `skills` store and `state` store before enabling the
#   surface. Do not copy publication rows between user triples or treat a
#   scope label as a cross-user visibility shortcut.

tools:
  # Phase 27 HTTP tool driver manifests — loaded at boot by the
  # HTTP-manifest boot loader (D-279). Each listed path is a
  # UTCP-style YAML manifest; secrets are ${ENV_VAR} references
  # (literal values rejected at load time). Assembly loads every
  # entry via `http.LoadManifest` and registers its tools on the
  # runtime catalog by name — AFTER built-in tools and BEFORE
  # `entries[]` below applies its middleware, so an `entries[]` block
  # naming a manifest tool (approval / OAuth / loading-mode) resolves
  # cleanly. A relative path resolves against THIS FILE's directory;
  # an absolute path is Clean-ed and accepted as-is. A manifest that
  # is missing, unparseable, or fails the driver's own validation
  # (literal secrets, `.Auth` template leaks, unknown fields, missing
  # env refs), or a tool name colliding with an already-registered
  # tool, fails the boot loudly, naming the file and this key.
  # Restart-required: manifests do not hot-reload.
  #
  #   http_manifests:
  #     - tools/http-weather.yaml        # relative to this file's dir
  #     - /etc/harbor/tools/github.yaml  # absolute, accepted as-is
  #
  # See examples/tools/http-weather.yaml for a worked manifest — it
  # pairs with the `entries[].oauth` binding below to demonstrate the
  # catalog OAuth-wrapping vehicle end to end (D-279). An absent or
  # empty `http_manifests` list is valid — this is the shipped-example
  # default so `harbor dev` boots with no external dependency.
  http_manifests: []

  # tools.entries[] — per-tool middleware bindings (approval / OAuth /
  # loading-mode), applied by name AFTER built-ins and http_manifests
  # register. Demonstrated here: the http-weather.yaml manifest's
  # `weather.lookup` tool bound to the `weather-broker` OAuth provider
  # declared below via `binding_scope: user` — the D-279 catalog-OAuth
  # vehicle. The pre-check acquires-and-discards a token from the
  # provider before every invoke (availability gating, D-271 pull-based
  # token exchange); the manifest's own `auth_ref` static header still
  # carries the HTTP request credential — the broker token is NOT
  # injected into the request (southbound injection is transport-
  # specific and Phase 148's concern for MCP).
  #
  # entries:
  #   - name: weather.lookup
  #     oauth:
  #       provider: weather-broker
  #       binding_scope: user
  entries: []

  # oauth_token_kek_env / oauth_providers — see examples/dev.yaml (D-095)
  # for the fully annotated reference, including the interactive
  # `oauth2` driver. `weather-broker` below (a `tokenexchange` provider,
  # D-271) is what the `entries[].oauth` binding above names.
  # oauth_token_kek_env: HARBOR_OAUTH_TOKEN_KEK
  # oauth_providers:
  #   - name: weather-broker
  #     driver: tokenexchange
  #     client_id_env: HARBOR_BROKER_CLIENT_ID
  #     client_secret_env: HARBOR_BROKER_CLIENT_SECRET
  #     token_url: https://broker.example.com/oauth2/token
  #     allowed_downstream_hosts: [api.weather.example]
  #     extra:
  #       audience: https://api.weather.example
  #     # resource_indicator (RFC 8707) — carried as the `resource` form param
  #     # on every exchange; a JWT-shaped returned token whose `aud` excludes
  #     # it fails the exchange loud. Never auto-populated from discovery — an
  #     # operator copies a discovered, confirmed value in by hand. tokenexchange
  #     # only (rejected on the interactive `oauth2` driver).
  #     resource_indicator: https://api.weather.example
  #     # include_actor_token (RFC 8693) — opt in to carrying the run's VERIFIED
  #     # acting principal (agent_id, when present) as an `actor_token` beside
  #     # the subject_token. Absent agent_id sends none. tokenexchange only.
  #     include_actor_token: true
  oauth_providers: []

  # allow_wire_oauth_descriptor (D-340) — DEV-ONLY, fail-closed opt-in that
  # permits `agent_config.set_oauth_provider` / `add_mcp_connection` to carry a
  # NEW server's OAuth params over the wire (token_url / audience / scopes),
  # still naming a boot-declared credential_broker, instead of only a provider
  # NAME — so a coordinator can stand up a new OAuth-fronted MCP server at runtime
  # without a static oauth_providers[] block + redeploy. Default false. With it
  # unset (all of production) a wire descriptor carrying token_url or audience is
  # REJECTED, exactly as the name-only binding rejects a sink field today. When
  # set the relaxation stays bounded: allowed_downstream_hosts is DERIVED from the
  # connected server's own URL (never a wire field) and the wire token_url dial
  # faces the identical token-exchange SSRF backstop; the runtime's OWN credential
  # custody stays boot-declared on the named broker (no credential-source URL or
  # secret rides the wire). The same
  # opt-in is also available globally via the HARBOR_ALLOW_WIRE_OAUTH_DESCRIPTOR
  # boot env; the effective posture is this flag OR that env. Restart-required.
  # Do NOT enable in production.
  # allow_wire_oauth_descriptor: false

  # allow_wire_injection (D-346) — DEV-ONLY, fail-closed opt-in that permits
  # `agent_config.add_mcp_connection` to carry a per-user credential-INJECTION
  # mapping for a RECEIVER-STYLE MCP server over the wire (the `injection`
  # object: which boot-declared oauth_providers[] broker + which target header /
  # basic / _meta key), so a coordinator can ATTACH such a server at runtime and
  # wire per-user credential delivery to it without a static
  # mcp_servers[].injection block + redeploy. INDEPENDENT of
  # allow_wire_oauth_descriptor (enable one without the other). Default false.
  # With it unset (all of production) a connection carrying any injection field
  # is REJECTED. The mapping is NON-SECRET (the credential is still pulled
  # per-user from the named broker at call time; nothing secret rides the wire);
  # when set the relaxation stays bounded — the pulled credential's reachable
  # host is DERIVED from the connection's own URL and validated against the named
  # broker's boot-declared allowed_downstream_hosts (never a wire field), and
  # every declared target key must be redaction-covered. The same opt-in is also
  # available globally via the HARBOR_ALLOW_WIRE_INJECTION boot env; the
  # effective posture is this flag OR that env. Restart-required. Do NOT enable
  # in production.
  # allow_wire_injection: false

  # MCP southbound attachments (Phase 28). Each entry boots a
  # *mcp.Provider whose discovered tools / resources / prompts merge
  # into the runtime catalog. The section is optional — operators
  # who don't attach external MCP servers omit it entirely.
  #
  # Per-server fields:
  #   name           — source-id prefix; must be unique across servers.
  #   transport_mode — `auto` | `sse` | `streamable_http` | `stdio`.
  #                    `auto` tries streamable-HTTP first, then SSE;
  #                    stdio is selected when only `command` is set.
  #   url            — required for sse / streamable_http (and auto
  #                    when transport is HTTP-flavoured).
  #   command        — required for stdio. ARGV-form ONLY: [0] is the
  #                    binary path, [1:] are arguments. Shell-form
  #                    (`sh -c "..."`) is FORBIDDEN per AGENTS.md §7.
  #   headers        — operator-supplied auth headers (bearer, API
  #                    key, etc.). Treated as secrets; redacted in
  #                    boot logs.
  #   keep_alive     — session ping interval; zero disables.
  #   policy         — (Phase 26b) per-server default tool reliability
  #                    policy. Optional; omit it and every tool inherits
  #                    the package default (30s per-attempt deadline /
  #                    4 total attempts). Fields:
  #                      max_attempts   — TOTAL attempts INCLUDING the
  #                                       first (NOT retries). 1 = one
  #                                       attempt, no retry; 4 = the
  #                                       default. Optional: omit it (or
  #                                       0) to inherit the default attempt
  #                                       count. Must be >= 0.
  #                      timeout_ms     — per-attempt deadline in ms.
  #                      retry_on       — retryable error classes; any of
  #                                       transient | timeout | 5xx |
  #                                       permanent.
  #                      backoff_base_ms / backoff_max_ms / backoff_mult
  #                                     — exponential-backoff knobs.
  #                    Per-FIELD fall-through: a field you omit inherits
  #                    the package default for THAT field. Setting only
  #                    timeout_ms keeps the default 4 attempts.
  #   tool_policies  — (Phase 26b) per-TOOL overrides keyed by the MCP
  #                    server-side tool name (e.g. `get_metadata`, NOT
  #                    the `<source>_<tool>` Harbor name). A tool named
  #                    here uses its override instead of `policy`; tools
  #                    absent from the map fall back to `policy` (or the
  #                    package default). Same field shape as `policy`.
  #
  # Examples (commented):
  #
  # mcp_servers:
  #   - name: github
  #     transport_mode: streamable_http
  #     url: https://example.com/mcp/github
  #     headers:
  #       Authorization: Bearer replace-me
  #     keep_alive: 30s
  #     # Per-server default: every github tool gets 3 total attempts
  #     # with a 10s per-attempt deadline. Omitted backoff fields keep
  #     # the package defaults (100ms base / 30s cap / x2 mult).
  #     policy:
  #       max_attempts: 3
  #       timeout_ms: 10000
  #       retry_on: [transient, timeout, 5xx]
  #     # Per-tool overrides: a slow metadata call gets ONE long attempt;
  #     # a flaky search gets more retries. Other github tools keep the
  #     # per-server default above.
  #     tool_policies:
  #       get_metadata:
  #         max_attempts: 1        # one attempt, no retry
  #         timeout_ms: 60000      # 60s single deadline
  #       search:
  #         max_attempts: 6
  #         timeout_ms: 5000
  #     # OAuth requirement discovery (D-297): when this server advertises an
  #     # OAuth requirement (a 401 + WWW-Authenticate step-up), Harbor
  #     # DISCOVERS the RFC 9728 -> RFC 8414 metadata chain and surfaces it as
  #     # inert data on mcp.servers.get — it NEVER runs the flow, holds a
  #     # token, or dials a discovered endpoint. The authorization-server hop
  #     # is inherently cross-origin and is fetched only for the public https
  #     # origins listed here (private-range / IP-literal hosts are refused).
  #     # Omit to leave the AS half of the chain needs-allowance (partial).
  #     oauth_discovery_allowed_origins:
  #       - https://login.example.com
  #     # oauth_provider — bind a declared tools.oauth_providers[] entry for
  #     # per-identity southbound bearer injection on every callTool RPC.
  #     # oauth_provider: weather-broker
  #     # tool_oauth_providers — per-entry oauth_provider overrides keyed by the
  #     # MCP-side name (mirrors tool_policies). An entry binds THAT provider for
  #     # every identity-stamped RPC that addresses by its key — a callTool by
  #     # tool name, a resource read / subscribe by resource URI, and a prompt
  #     # get by prompt name; an unlisted key falls back to oauth_provider. Each
  #     # entry re-enforces the same binding rules (unknown name / stdio /
  #     # static-Authorization conflict / downstream-host allow-list); a key that
  #     # would address more than one surface at once is rejected loud at
  #     # discovery. Closes the one-audience-per-server constraint for a shared
  #     # server fronting N downstream tools, resources, and prompts.
  #     # tool_oauth_providers:
  #     #   send_mail: m365-mail-broker      # a tool
  #     #   list_events: gcal-broker         # a tool
  #     #   cal://calendars/primary: gcal-broker   # a resource URI
  #     #   draft_reply: m365-mail-broker    # a prompt
  #     # injection — per-user credential INJECTION for a RECEIVER-STYLE server
  #     # (one that RECEIVES its credential on each request instead of PULLING it
  #     # via RFC 8693). The runtime SOURCES the acting user's credential from the
  #     # named broker per call (the SAME per-user broker-pull as oauth_provider)
  #     # and INJECTS it in the declared, NON-SECRET form. Only the pulled value is
  #     # secret; the mapping is config. Mutually exclusive with oauth_provider /
  #     # tool_oauth_providers / a static Authorization header (one auth mode per
  #     # connection). The broker's allowed_downstream_hosts must list this
  #     # connection's host (fail-closed). The target header / _meta leaf key MUST
  #     # be redaction-covered (a credential segment such as -api-key / -token /
  #     # -secret) so the audit redactor always holds the injected value to ***.
  #     # Pick exactly ONE form:
  #     # injection:
  #     #   provider: recv-broker            # a declared tools.oauth_providers[] broker
  #     #   form: header                     # header | basic | meta
  #     #   header: x-vendor-api-key         # form=header: the pulled value → this header
  #     #   # form=basic → Authorization: Basic base64(basic_username ":" <pulled>)
  #     #   # basic_username: svc
  #     #   # form=meta → the pulled value → this dot-path _meta leaf
  #     #   # meta_key: vendor.api_key
  #     # artifact_byte_eligible / artifact_params — EGRESS SUBSTITUTION: the
  #     # runtime resolves an artifact id the model authored and places the
  #     # resolved BYTES into the outbound tool-call body, so a large document
  #     # reaches this server WITHOUT transiting the model's context. The
  #     # substituted value is RFC 4648 §4 standard base64 (never a raw Go
  #     # string — encoding/json would rewrite every invalid-UTF-8 byte to
  #     # U+FFFD and corrupt any binary document).
  #     #
  #     # artifact_byte_eligible is the CONTAINMENT BOUNDARY: without it an
  #     # artifact_params mapping is refused at the door and no call ever
  #     # carries content. Both are http-only (refused on stdio, explicit or
  #     # auto-selected from a command-only config).
  #     #
  #     # Each mapped parameter is validated at attach against THIS SERVER'S
  #     # OWN discovered inputSchema — it must be declared, and declared
  #     # string-typed — so Harbor never asserts an argument shape the server
  #     # did not publish.
  #     #
  #     # What widens is the RECIPIENT, not the reachable artifact SET: a call
  #     # reaches the dispatching run's own (tenant, user, session) and nothing
  #     # wider. Stated plainly: both fields are admin-writable over the
  #     # control plane, and artifact bytes are stored AS AUTHORED
  #     # (unredacted), so a byte-eligible connection CAN move a secret. That
  #     # sits inside the trust boundary a shared runtime already accepts — it
  #     # trusts its co-tenant admins for runtime-added connections — and a
  #     # deployment needing hard isolation runs ONE RUNTIME PER TENANT.
  #     #
  #     # The compensating control is mandatory: every substitution emits
  #     # `mcp.artifact_egressed` FAIL-CLOSED before the wire request (ids,
  #     # sizes, a sha256: digest — never the bytes). A substitution that
  #     # could not be recorded does not happen. Ceiling:
  #     # tools.mcp_artifact_egress_max_bytes below.
  #     #
  #     # Known limit: a byte-mapped parameter is NOT reachable from an MCP
  #     # App's tool callback (a browser-driven invocation has no run, so no
  #     # resolver is seated and the call fails loud).
  #     # artifact_byte_eligible: true
  #     # artifact_params:
  #     #   ingest_document: [content]   # tool name -> parameter names
  #     #   summarize: [document]
  #     #   generate_image: [reference_image_base64_1?, reference_image_base64_2?]
  #     # A trailing `?` marks an optional artifact slot. Harbor strips it
  #     # before matching the server schema; an omitted or null optional slot
  #     # is skipped, while an explicitly empty id still fails closed.
  #
  #   - name: filesystem
  #     transport_mode: stdio
  #     command:
  #       - /usr/local/bin/mcp-server-filesystem
  #       - /var/data/filesystem-root
  mcp_servers: []

  # mcp_app_host — the deployment-wide MCP App (`io.modelcontextprotocol/ui`)
  # host capability the runtime advertises to EVERY MCP server during the
  # initialize handshake. The host's rendering ability does not vary per
  # server, so this is one deployment-level block (not a per-server field).
  #
  #   display_modes — the MCP App display modes this host can render, from the
  #                   closed set `inline` / `fullscreen` / `pip`. A server
  #                   reads these to tailor the app references it returns.
  #
  # Omitting the block (or leaving display_modes empty) resolves to the
  # inline-only BASELINE — `[inline]`, the mode the Console renders out of
  # the box. Set the full set once the deployment's Console serves the
  # fullscreen-tab and side-by-side (pip) layouts:
  #
  # mcp_app_host:
  #   display_modes: [inline, fullscreen, pip]

  # mcp_app_render_admission — (D-412 fresh render-admission amendment,
  # Shipped v1.28) the durable-reopen MCP App render-admission surface.
  #
  #   enabled — default `false`; opt in to the fresh stateless,
  #   integrity-protected render admissions minted on embedded/durable reopen
  #   after the full verified identity / signed agent reach / retirement /
  #   erasure / exposure / server / current `ui://` resource / paused-disabled
  #   / descriptor generation checks. Claims bind schema/time/triple/
  #   effective-agent/server/resource/generation and carry no raw args,
  #   secrets, provider output, callback name, or general capability; ordinary
  #   resource reads never mint; the live tool-result path keeps only a
  #   bounded short-lived provider-local binding that is never durable or
  #   restored. Sealing REUSES the existing deployment-shared KEK authority —
  #   `tools.oauth_token_kek_env` (the same AES-256-GCM sealer the OAuth token
  #   path uses); there is no second authority field and no literal key. An
  #   ENABLED surface with an empty env name, a missing/unset/invalid KEK, or
  #   a sealer construction failure fails readiness LOUD, naming the problem,
  #   even when no OAuth provider or credential broker is configured. Restart
  #   and multi-replica deployments verify against the shared KEK (a
  #   per-process ephemeral key breaks cross-replica verification). No
  #   persisted callback authority, hot registry, or transcript impersonation.
  #
  # mcp_app_render_admission:
  #   enabled: true

  # mcp_artifact_egress_max_bytes — the ceiling for ONE substituted artifact
  # value on one outbound MCP tool call (see mcp_servers[].artifact_params
  # above). A value above it is REFUSED LOUD, never truncated: a partial
  # document delivered to a remote ingester is a corruption, not a bounded
  # read, and a tool argument has nowhere to carry a truncation signal.
  #
  # Deliberately INDEPENDENT of the heavy-output threshold. Substituted bytes
  # never enter a model's context, so this is a network and memory budget,
  # not a token budget.
  #
  # Sizing: the transient footprint is `ceiling x in-flight mapped calls`. It
  # is NOT multiplied by the retry budget — resolution happens once per
  # dispatched call, not once per attempt. Base64 inflates the wire form by
  # about a third (8 MiB of content is ~11 MB on the wire).
  #
  # Omit for the 8 MiB default; a negative value is refused at config load
  # rather than read as "unbounded". Restart-required.
  #
  # mcp_artifact_egress_max_bytes: 4194304   # 4 MiB

distributed:
  # MessageBus driver — Harbor's at-least-once cross-worker fan-out
  # edge. One of:
  #   loopback (default) — in-process; projects envelopes through the
  #     typed events.EventBus. No durability / cross-instance fan-out.
  #   durable — persists every BusEnvelope through the StateStore and
  #     projects it onto the local event bus, with a poller that also
  #     delivers envelopes published by other instances sharing the
  #     store (or left by a crash): at-least-once cross-instance
  #     fan-out + restart-replay. StateStore-backed (Postgres-as-queue
  #     on a shared Postgres store); reuses the runtime StateStore and
  #     fails loud if none is wired. Tune the scan cadence with
  #     bus_poll_interval (default 1s). NATS / Redis Streams remain
  #     future drivers.
  # Handlers MUST be idempotent on (TaskID, Edge, EventID) so the
  # same consumer code works against every driver.
  bus_driver: loopback
  # bus_poll_interval: 1s   # durable driver only; default 1s
  # RemoteTransport driver — Harbor's cross-process / cross-host call
  # surface, designed against the full A2A v1 spec (vendored at
  # docs/specifications/a2a.proto). Phase 22 ships `loopback`
  # (in-process dispatch to a registered Agent stub, used by
  # conformance tests); Phase 29 adds `a2a` (the wire driver: JSON-RPC
  # 2.0 over HTTPS + SSE, Agent Card discovery via
  # `GET /.well-known/agent-card.json`, route-scoring Registry).
  # When `remote_driver: a2a`, populate `tools.a2a_peers` below.
  remote_driver: loopback

# Phase 29 tools subsystem config — the unified tool catalog's per-
# transport peer lists. V1 ships only A2APeers; HTTP / MCP land in
# Phases 27 / 28. Omit the `tools:` block entirely when no remote
# tool sources are configured (the field is optional).
# tools:
#   a2a_peers:
#     # First-party in-org agent. HTTPS is required for non-loopback
#     # peers (AGENTS.md §7); the driver rejects http:// URLs whose
#     # host is not 127.0.0.1 / ::1 / localhost.
#     - url: https://agent.example.com
#       # Operator-set trust tier in [1, 5]: 1 = third-party with no
#       # contract, 5 = first-party in-org. The route-scoring
#       # registry uses this to rank peers when more than one declares
#       # the same capability (D-034: trust outranks latency 5:1).
#       trust_tier: 5
#       # Operator-set hint at the peer's expected p50 latency (ms).
#       # Smaller is better; latency is the tie-breaker among
#       # similarly-trusted peers.
#       latency_tier_ms: 30
#       # Reserved for loopback HTTP peers ONLY. Setting this on a
#       # non-loopback HTTP URL is STILL rejected — the flag is a
#       # name-checked override, not an HTTPS bypass.
#       allow_insecure_loopback: false
#       # Per-peer Agent Card cache TTL. Zero falls back to the
#       # driver default (10 minutes).
#       agent_card_ttl: 10m
