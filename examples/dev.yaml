# Harbor — `harbor dev` example configuration (Phase 64, D-089).
#
# This is the canonical config for the local-dev loop. It points at
# the production bifrost LLM driver — Phase 64 (D-089) flipped the
# default from "mock" to "bifrost" so a missing `llm.driver` is the
# fail-loud case, not a silent stub. Operators copy this file to
# `harbor.yaml` at their project root and edit:
#
#   1. `identity.issuer` / `identity.audience` / `identity.jwks_url`
#      to point at a real OIDC provider. The default `harbor dev`
#      mints an ephemeral ES256 dev token for local convenience —
#      production deployments need a real JWKS source.
#
#   2. `llm.api_key` — the example uses `env.OPENROUTER_API_KEY`. The
#      bifrost driver resolves `env.NAME` references via os.Getenv()
#      at construction time; missing env var → fail closed with
#      ErrMissingAPIKey at boot. Pick whichever env var your secret
#      store populates.
#
#   3. Optional: `llm.model` if the default `anthropic/claude-sonnet-4`
#      isn't what your deployment routes through.
#
# Once edited, run:
#
#   harbor dev               # boots against ./harbor.yaml on :18080
#   harbor dev --port 8080   # custom port
#
# For the dev-only escape hatch (the §13 amendment surface):
#
#   HARBOR_DEV_ALLOW_MOCK=1 harbor dev
#
# The escape hatch prints a stderr banner [DEV-ONLY MOCK LLM — DO
# NOT USE IN PRODUCTION] on every boot. The default path with no
# flag set demands a real provider.

server:
  bind_addr: 127.0.0.1:8080
  shutdown_grace_period: 30s
  # debug_addr enables the off-by-default pprof debug listener on its own
  # loopback-only port (a separate http.Server, never the Protocol mux).
  # Must be a loopback host:port; the validator rejects anything off-box.
  # The HARBOR_DEBUG_ADDR env var overrides this for ad-hoc/preflight use.
  # debug_addr: 127.0.0.1:6060

identity:
  # Asymmetric algorithms only (Harbor §7 security rule 1). The
  # validator's parser rejects HS* and `none` at the algorithm
  # allowlist BEFORE the keyfunc runs.
  jwt_algorithms:
    - RS256
    - ES256
  # Replace these with your OIDC provider's values for non-local
  # deployments. The `harbor dev` ephemeral dev-token bypass uses
  # its own in-memory keypair (issuer=harbor-dev, audience=harbor);
  # production wiring through jwks_url lands in a later release-
  # engineering phase.
  issuer: https://issuer.example.com
  audience: harbor
  jwks_url: https://issuer.example.com/.well-known/jwks.json
  # Max-stale ceiling for the cached JWKS snapshot. Omit (or 0) for the
  # safe default (1h): past this age WITHOUT a successful refresh the
  # verifier fails closed rather than serving a possibly-revoked key.
  # jwks_max_stale: 1h

telemetry:
  log_format: text
  log_level: info
  service_name: harbor-dev

state:
  # In-memory state for the dev loop. Production switches to sqlite
  # (single-node) or postgres (multi-replica). The Phase 57 durable
  # event log requires a non-inmem state driver — flip both together.
  driver: inmem

llm:
  # Production driver — the Phase 33 bifrost gateway. Phase 64 /
  # D-089 made this the default; a missing `driver:` field defaults
  # to bifrost. The mock LLM is only available via the `HARBOR_DEV_ALLOW_MOCK=1`
  # env var (the §13 dev-only escape hatch).
  driver: bifrost
  provider: openrouter
  model: anthropic/claude-sonnet-4
  # Resolved as os.Getenv("OPENROUTER_API_KEY") at driver construction
  # time. Pick whichever env var your secret store populates. NEVER
  # commit a literal API key here — the validator accepts a literal
  # value but the linter / reviewer SHOULD reject the PR.
  api_key: env.OPENROUTER_API_KEY
  timeout: 60s
  context_window_reserve: 0.05
  model_profiles:
    anthropic/claude-sonnet-4:
      context_window_tokens: 200000
      token_estimator: chars_div_4
      json_schema_mode: native
      reasoning_effort: low

# Runtime run-lifecycle hooks. The run-completion hook dispatches the run's
# transcript to a named catalog tool at the terminal boundary (for memory /
# audit / analytics sinks). Empty `tool` disables it; the agent-config
# `hooks` section can enable it per agent. A hook failure never alters the
# run outcome. See docs/CONFIG.md → Runtime.
# runtime:
#   hooks:
#     run_completion:
#       tool: run_transcript_sink
#       timeout: 10s
#
#   # Session auto-naming — OPT-IN, default OFF. With this block absent (or
#   # `auto: false`) the runtime writes no naming counters, makes no naming
#   # LLM calls, and emits no naming events. When on, the runtime titles a
#   # session at each run's terminal boundary via one governed LLM call over
#   # a bounded transcript digest; a naming failure never alters the run
#   # outcome. A per-agent agent-config `naming` section overrides this fleet
#   # default (a bare `{auto: false}` revision is an explicit per-agent
#   # opt-out). See docs/CONFIG.md -> Runtime.
#   naming:
#     auto: true                    # false (default) = off
#     after_turns: 1                # first auto-name after N completed runs (default 1)
#     repeat_every: 0               # 0 = name once; >0 re-names every N turns
#     max_repetitions: 5            # REQUIRED >=1 when repeat_every > 0 (no unlimited value)
#     max_title_len: 80             # rune bound [8,200] (default 80); auto output is clamped
#     model: ""                     # empty = the run's effective model; else a model_profiles key

governance:
  repair_attempts: 3

events:
  driver: inmem
  max_subscribers_per_session: 16
  subscriber_buffer_size: 256
  idle_timeout: 60s
  drop_window: 1s
  replay_buffer_size: 10000

sessions:
  idle_ttl: 24h
  hard_cap: 720h
  sweep_interval: 15m

# Phase 111c (D-200) — pause lifecycle. 0 = pauses never expire (the
# default; the sweeper is not started). Set e.g. `max_park_duration:
# 24h` to reap pauses nobody answered; expired pauses resume with the
# typed `timeout` Decision and the waiting run terminates as a
# constraints-conflict.
pauseresume:
  max_park_duration: 0s
  sweep_interval: 1m

artifacts:
  driver: inmem
  heavy_output_threshold_bytes: 32768

tasks:
  driver: inprocess
  retain_turn_timeout: 5m
  continuation_hop_limit: 8

distributed:
  bus_driver: loopback
  remote_driver: loopback

memory:
  # `none` (Phase 23 default — AddTurn is a no-op) is the safest
  # starting point. Flip to `rolling_summary` once you have a working
  # agent and need conversation compaction; Phase 64 wires an
  # LLM-backed Summarizer through llm/summarizer when this is set.
  driver: inmem
  strategy: none
  recovery_backlog_max: 16
  # Opt-in semantic retrieval (Phase 84d — D-191): embeds turns and
  # serves MemoryStore.SearchTurns by cosine similarity, composing
  # with the strategy above. Requires a top-level `embeddings:` block
  # (provider + model + api_key — see examples/harbor.yaml); the
  # validator fails the boot loudly without one. `skills.retrieval:
  # semantic` opts skill_search into the same mode.
  # retrieval: semantic

# D-103 — Planner driver selection (closes issue #126). The V1
# reference planner is `react` (the LLM-driven ReAct concrete from
# Phase 45 / D-051). Future drivers (Plan-Execute, Workflow, Graph,
# Deterministic, Supervisor, MultiAgent, HumanApproval per RFC §6.2)
# self-register under `internal/planner/<name>/` + a blank import in
# `cmd/harbor/main.go`; flip `driver:` to opt into them.
#
# `max_steps` overrides the driver-side circuit-breaker step cap.
# Zero (the default) means "use the driver's internal default" —
# `react.DefaultMaxSteps` (12) for the V1 reference driver. Raise for
# longer trajectories; lower to fail fast in tests.
planner:
  driver: react
  # max_steps: 12
  # reasoning_replay: never   # never (default, all models) | text — see harbor.yaml
  # parallel_tool_calls: true # Phase 107d / D-169. Default true: when the
  #                           # LLM returns several tool-calls in one turn,
  #                           # the runtime dispatches them concurrently.
  #                           # false → serialise one per step (107c fallback).
  # absolute_max_spawn_depth: 4 # Phase 107e / D-170. Caps how deeply a
  #                           # planner-spawned background task (_spawn_task)
  #                           # may itself spawn further background tasks.
  #                           # Zero/unset → 4. A spawn beyond the cap is
  #                           # rejected loudly (the planner sees an error).

tools:
  # UTCP-style HTTP tool manifests, loaded at boot and registered on
  # the catalog by name (the HTTP-manifest boot loader, D-279) — see
  # examples/harbor.yaml for the fully annotated reference and
  # examples/tools/http-weather.yaml for a worked manifest paired
  # with the `entries[].oauth` binding below.
  http_manifests: []
  mcp_servers: []

  # Southbound per-identity OAuth binding (D-278). An http(s) MCP server
  # can BIND a declared `oauth_providers[]` entry by its non-secret NAME:
  # every identity-stamped per-call RPC to that server then resolves a
  # fresh bearer for the CALLING identity and injects
  # `Authorization: Bearer <tok>` on THAT request only (the connect-time
  # `headers` stay for the initialize/discovery handshake — a user-scoped
  # bearer cannot exist before a per-call identity does). A bound provider
  # whose token fetch fails aborts the call loud — never an unauthenticated
  # fallback. `oauth_provider` is a NAME, not a secret; the secret stays
  # env-indirected on the provider entry above. Rejected at validation:
  # an unknown provider name, a binding on any connection without an
  # http(s) `url` (explicit `stdio` AND an omitted/`auto` transport with
  # only a `command`, which would auto-select stdio and silently never
  # inject), and a static `Authorization` header alongside the binding
  # (one auth mode per connection).
  #
  # `meta_annotations` is a static, NON-SECRET operator map merged verbatim
  # into the MCP `_meta` on every identity-stamped call — the deployment's
  # own attribution vocabulary, passed to the server as-is alongside the
  # `(tenant, user, session)` triple and the provenance `agent_id`. Reserved
  # keys (`tenant`/`user`/`session`/`agent_id`/`traceparent`/`tracestate`
  # and any `io.modelcontextprotocol/`-prefixed key) and empty keys are
  # rejected at validation.
  #
  #   mcp_servers:
  #     - name: enterprise-graph
  #       transport_mode: streamable_http  # or sse / auto — never stdio
  #       url: https://mcp.example.com/graph
  #       oauth_provider: m365-broker    # names an oauth_providers[] entry;
  #         # the provider's allowed_downstream_hosts MUST list this
  #         # connection's host (mcp.example.com) — D-300 fail-closed.
  #       meta_annotations:
  #         deployment: prod-eu
  #         fleet: harbor-west

  # Phase 83n / D-153 + Phase 107c / D-167 — opt in to the small set
  # of built-in tools shipped in the Harbor binary. Empty list (the
  # default) registers nothing. Available names mirror
  # `internal/tools/builtin.KnownNames()` and are validated pre-boot
  # by `internal/config` — a typo fails closed at config load.
  #
  # Default-recommended set (lights up the discovery loop end-to-end):
  #
  #   built_in:
  #     - clock.now      # heartbeat / sanity-check
  #     - text.echo      # smoke-test action
  #     - tool_search    # LLM discovers deferred tools by capability
  #     - tool_get       # LLM fetches a tool's full schema
  #     - skill_search   # LLM discovers skills (capability-filtered, Phase 111d)
  #     - skill_get      # LLM fetches skill bodies (budget-fit + redacted)
  #     - skill_list     # LLM enumerates the skill catalog (paged, summary-only)
  #
  # Deliberate opt-in (Phase 111d / D-201 — NOT in any recommended
  # set): `skill_propose` lets the LLM author + persist new skills
  # (Origin=generated; pack skills protected; audit-mandatory).
  #
  #   built_in:
  #     # ...the discovery set...
  #     - skill_propose
  #
  # Optional escape-hatch (Phase 107c step 10 — D-167):
  #
  #   built_in:
  #     # ...the discovery set...
  #     - declarative_action
  #
  # The `declarative_action` meta-tool lets the LLM dispatch any
  # catalog tool through a typed `{tool, args}` envelope (or a free-
  # text `body` parsed via `repair.ActionParser`). Use ONLY when your
  # provider lacks reliable native tool-calling — local Llama / Mistral
  # / weaker fine-tunes that emit prompt-engineered JSON instead of
  # provider-native tool_calls. Modern providers (OpenAI / Anthropic /
  # Gemini, including OpenRouter routes through them) emit native
  # tool_calls and the escape hatch is unnecessary noise. The meta-
  # tool registers with `loading_mode: deferred` so it stays out of
  # every-turn declarations until `tool_search("structured action
  # format")` surfaces it — keeping the prompt budget clean when
  # operators opt in but the LLM doesn't actually need it.
  # built_in: []

  # D-095 — Operator-config-driven OAuth provider declarations (closes
  # issue #116 + D-090's deferred construction gap). Uncomment and
  # populate to attach OAuth-bound tools to a real authorization
  # server. The V1 default driver is `oauth2` (generic OAuth2/PKCE
  # Authorization Code flow); future per-vendor drivers
  # (`google-workspace`, `github-app`, ...) add a new entry under
  # `internal/tools/auth/drivers/<name>/` + a blank import in
  # `cmd/harbor/main.go`.
  #
  # Credentials enter via env-var indirection (§7 rule 2 — never
  # hardcoded, never logged). The dev stack resolves `os.Getenv(NAME)`
  # at boot and fails closed when the env var is unset or empty.
  #
  # `oauth_token_kek_env` names the env var holding the 32-byte
  # hex-encoded key-encryption key (KEK) for AES-256-GCM token
  # encryption at rest. Required whenever `oauth_providers[]` is
  # non-empty. Generate via e.g. `openssl rand -hex 32`. NEVER commit
  # the literal KEK.
  #
  # D-300 — credential-sink hardening. `allowed_downstream_hosts` is the
  # boot-declared set of downstream connection hosts (host[:port]) a
  # provider's credential may be injected into. MANDATORY for any provider
  # a `tools.mcp_servers[]` connection binds — the credential-plane
  # invariant is that no admin-writable field determines where a credential
  # is sent, so the sink set is boot-pinned. A binding whose MCP connection
  # host is not listed is refused at boot, fail-closed. Default-port
  # equivalence holds (`api.github.com` ≡ `api.github.com:443`).
  #
  # oauth_token_kek_env: HARBOR_OAUTH_TOKEN_KEK
  # oauth_providers:
  #   - name: github
  #     driver: oauth2
  #     client_id_env: GITHUB_OAUTH_CLIENT_ID
  #     client_secret_env: GITHUB_OAUTH_CLIENT_SECRET
  #     scopes: ["repo", "read:user"]
  #     auth_url: https://github.com/login/oauth/authorize
  #     token_url: https://github.com/login/oauth/access_token
  #     redirect_url: https://your-deployment.example.com/oauth/callback
  #     allowed_downstream_hosts: ["api.github.com"]   # D-300 sink allow-list
  #
  #   # The `tokenexchange` driver: pull-based external-credential
  #   # provisioning. Instead of the interactive authorization-code flow,
  #   # the runtime obtains a downstream tool credential from an external
  #   # credential broker (a fleet orchestrator, an enterprise token
  #   # vault, an STS) via an RFC-8693 token exchange keyed on the
  #   # VERIFIED ctx identity triple. Brokered tokens are TTL-cached in
  #   # memory only — never persisted — so one central grant serves N
  #   # runtimes without N consents. `token_url` is the broker's
  #   # token-exchange endpoint and is MANDATORY; `auth_url` /
  #   # `redirect_url` are interactive-flow fields and are NOT used.
  #   # `client_id_env` / `client_secret_env` name the env vars holding
  #   # the runtime's OWN credential for authenticating to the broker.
  #   # Optional `extra` knobs: `audience` (RFC-8693 audience; defaults
  #   # to the provider name) and `cache_ttl_cap` (max in-memory cache
  #   # lifetime; a Go duration, default 5m; values below 30s are
  #   # rejected at boot). A cached token is served until the EARLIER of
  #   # the broker-advertised expiry and the cap — never past the
  #   # broker's own expiry. Re-exchange is rate-floored at 30s per
  #   # subject: within 30s of the previous exchange a re-exchange
  #   # fails loudly; once the window elapses the next call
  #   # re-exchanges normally. The floor only bites when the broker
  #   # advertises an expiry shorter than 30s (a misconfiguration) —
  #   # at most one exchange per 30s window, loud failures in between.
  #   - name: m365-broker
  #     driver: tokenexchange
  #     client_id_env: HARBOR_BROKER_CLIENT_ID
  #     client_secret_env: HARBOR_BROKER_CLIENT_SECRET
  #     scopes: ["Mail.Read", "Calendars.Read"]
  #     token_url: https://broker.example.com/oauth2/token
  #     allowed_downstream_hosts: ["graph.microsoft.com"]  # D-300 sink allow-list (MANDATORY when bound)
  #     # D-300 ceilings (optional hardening; boot-declared, never wire-derived):
  #     audience: https://graph.microsoft.com   # authority for the exchanged token's audience
  #     scope_ceiling: ["Mail.Read", "Calendars.Read"]  # requested scopes intersected against this
  #     extra:
  #       cache_ttl_cap: 5m
  #
  #   # credential_source (D-285) — WHERE a provider's OWN client
  #   # credential (client_id / client_secret) comes from:
  #   #   - env (the DEFAULT; omit the field): resolved from
  #   #     client_id_env / client_secret_env ONCE at boot, fail-loud when
  #   #     unset. Existing configs are byte-compatible.
  #   #   - remote: the runtime PULLS the credential from a coordinator
  #   #     endpoint at first need — memory-only TTL cache, single-flight,
  #   #     fail-loud. A coordinator that mints the runtime's credential
  #   #     AFTER boot reaches it with zero touch, and the broker secret
  #   #     NEVER enters the runtime's environment (defense-in-depth).
  #   #     Valid only for the `tokenexchange` driver; declaring `remote`
  #   #     alongside client_id_env / client_secret_env is a validation
  #   #     error (one source per entry).
  #   #
  #   # The coordinator serves a single authenticated GET
  #   # (Authorization: Bearer <auth_token_env>) → strict JSON
  #   # {"format_version":1,"client_id":...,"client_secret":...,"expires_in":N}.
  #   # `remote.url` MUST be https (the fetch carries the runtime's
  #   # service bearer token); plaintext http is accepted only for a
  #   # loopback host (127.0.0.1 / ::1 / localhost — the fixture/dev
  #   # case). Redirects from the endpoint are refused, never followed.
  #   - name: m365-broker-remote
  #     driver: tokenexchange
  #     credential_source: remote
  #     scopes: ["Mail.Read", "Calendars.Read"]
  #     token_url: https://broker.example.com/oauth2/token
  #     allowed_downstream_hosts: ["graph.microsoft.com"]  # D-300 sink allow-list
  #     audience: https://graph.microsoft.com              # D-300 audience ceiling
  #     remote:
  #       url: https://coordinator.example.com/runtimes/self/broker-credential
  #       auth_token_env: HARBOR_COORDINATOR_TOKEN  # runtime's own service token
  #       cache_ttl: 5m    # optional; caps the in-memory serve horizon
  #       timeout: 10s     # optional; bounds a single fetch

  # D-300 — `oauth_credential_brokers[]`: boot-declared, NAMED credential
  # SINKS. The config home for the pinned token endpoint + allowed
  # downstream hosts a Protocol-installed, zero-URL provider descriptor
  # references BY NAME (so no sink-determining value ever rides the wire).
  # Additive — the inline `oauth_providers[].remote` block above stays
  # valid. Config/file-only, restart-required (NOT a Protocol surface).
  #
  # A broker referenced by a Protocol-installed provider
  # (`agent_config.set_oauth_provider`, Phase 169 / D-303) pins EVERY
  # credential sink at boot; the wire descriptor names only the broker +
  # a scope subset. `credential_url` is the D-271 `remote` credential-pull
  # endpoint (where the runtime pulls its org client_id/secret, authenticated
  # by `auth_token_env`); `token_url` is the RFC-8693 exchange endpoint.
  # `audience` is pinned server-side; `scope_ceiling` clamps the descriptor's
  # requested scopes. Declaring any broker requires `oauth_token_kek_env`
  # (an installed provider shares the boot token store).
  #
  # oauth_credential_brokers:
  #   - name: m365-broker
  #     token_url: https://broker.example.com/oauth2/token   # RFC-8693 exchange sink
  #     credential_url: https://broker.example.com/credential # D-271 remote pull (Phase 169)
  #     allowed_downstream_hosts: ["graph.microsoft.com"]    # required, non-empty
  #     auth_token_env: HARBOR_M365_BROKER_TOKEN             # runtime's broker credential
  #     audience: https://graph.microsoft.com                # optional, pinned
  #     scope_ceiling: ["mail.read", "mail.send"]            # optional, clamps installed scopes
  #     cache_ttl: 5m    # optional
  #     timeout: 10s     # optional

  # tools.entries[] — per-tool middleware bindings (approval / OAuth /
  # loading-mode), applied by name AFTER built-ins and http_manifests
  # register. This is the D-279 catalog-OAuth vehicle: a manifest tool
  # (e.g. `weather.lookup` from examples/tools/http-weather.yaml, wired
  # via `http_manifests` above) bound to a `tokenexchange` provider
  # declared under `oauth_providers` above. The pre-check acquires-
  # and-discards a broker token before every invoke (availability
  # gating); the manifest's own `auth_ref` static header still carries
  # the HTTP request credential.
  #
  # entries:
  #   - name: weather.lookup
  #     oauth:
  #       provider: m365-broker
  #       binding_scope: user

# Phase 65 (D-099) — `harbor dev` hot-reload supervisor. The block is
# opt-out: every field has a loader-applied default that mirrors the
# values below; omit the block entirely to inherit them. Operators that
# want hot-reload off pass `--no-hot-reload` to `harbor dev` OR set
# `enabled: false` here OR set `policy: disabled`. Restart-required.
cli:
  dev_hot_reload:
    # `enabled: true` is the default; flip to false to disable the
    # watcher entirely (equivalent to passing `--no-hot-reload`).
    enabled: true
    # `policy: drain` (default) waits up to `drain_timeout` for in-
    # flight RunLoops before forcing close. `policy: cancel`
    # immediately cancels in-flight; `policy: disabled` opts out at
    # the config layer (equivalent to `enabled: false`).
    policy: drain
    drain_timeout: 5s
    # The watcher unions these paths with the loaded config file's
    # parent directory, so a `harbor.yaml` edit always triggers a
    # reload. Defaults to `[".harbor/agents"]` — the Phase 66
    # project-local drafts directory.
    watch_roots:
      - .harbor/agents
